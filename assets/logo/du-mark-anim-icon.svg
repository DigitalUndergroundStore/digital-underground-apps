<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 90 332 332"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9a8ff"/><stop offset=".45" stop-color="#7c5cff"/></linearGradient></defs><style>
.d,.u{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.2s cubic-bezier(.6,0,.2,1) forwards}
.u{animation-delay:.25s;animation-duration:.95s}
.dg{filter:drop-shadow(0 0 6px #7c5cff)}.ug{filter:drop-shadow(0 0 6px #22d3ee)}
.glow{animation:pulse 3.2s ease-in-out 1.3s infinite}
.wm{opacity:0;animation:fade .6s ease-out .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px rgba(124,92,255,.5)) drop-shadow(0 0 2px rgba(34,211,238,.4))}50%{filter:drop-shadow(0 0 12px rgba(124,92,255,.9)) drop-shadow(0 0 8px rgba(34,211,238,.7))}}
@media (prefers-reduced-motion:reduce){.d,.u{animation:none;stroke-dashoffset:0}.glow{animation:none;filter:drop-shadow(0 0 5px rgba(124,92,255,.6))}.wm{animation:none;opacity:1}}
</style><g class="glow"><g fill="none" stroke-linejoin="miter" stroke-linecap="butt"><path class="d" d="M124 224 V112 H288 L356 180 V268 L288 336 H124 Z" stroke="url(#gd)" stroke-width="52"/><path class="u" d="M236 196 V360 L276 400 H352 L392 360 V196" fill="none" stroke="#05040c" stroke-width="84" stroke-linejoin="miter"/><path class="u" d="M236 196 V360 L276 400 H352 L392 360 V196" stroke="#22d3ee" stroke-width="52"/></g></g></svg>