<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face {
  font-family: InterVar;
  src: url("file:///usr/share/fonts/truetype/sand-box/google/Inter/Inter-VariableFont_opsz,wght.ttf") format("truetype");
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
}
@font-face {
  font-family: OutfitVar;
  src: url("file:///usr/share/fonts/truetype/sand-box/google/Outfit/Outfit-VariableFont_wght.ttf") format("truetype");
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: #0b0d14;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-family: InterVar, Inter, system-ui, sans-serif;
}
.logo { display: block; height: auto; }


body {
  background:
    radial-gradient(900px 560px at 50% 120%, rgba(100, 70, 220, 0.45), transparent 58%),
    radial-gradient(700px 400px at 50% -10%, rgba(80, 100, 220, 0.22), transparent 55%),
    #090811;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  width: 1200px; height: 630px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 36px 60px 32px;
}
.logo { width: 300px; margin: 0 auto 22px; }
.title {
  font-family: OutfitVar, Outfit, InterVar, sans-serif;
  font-weight: 800;
  font-size: 118px;
  line-height: 0.9;
  letter-spacing: -0.05em;
  color: #fff;
}
.tag {
  margin-top: 14px;
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: #c8cbd4;
}
.price-block { margin-top: 22px; }
.big-price {
  font-family: OutfitVar, Outfit, InterVar, sans-serif;
  font-weight: 800;
  font-size: 64px;
  letter-spacing: -0.04em;
  color: #fff;
  line-height: 1;
}
.founding {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  background: rgba(16, 36, 44, 0.8);
  color: #7ef0dc;
  font-weight: 650;
  font-size: 24px;
  letter-spacing: -0.01em;
  padding: 10px 18px 10px 16px;
  border-radius: 999px;
  border: 1px solid rgba(94, 234, 212, 0.38);
  line-height: 1;
}
.founding svg { width: 16px; height: 16px; color: #7ef0dc; }
.features {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin-top: 32px;
  width: 100%;
  max-width: 980px;
}
.feat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.ico {
  width: 64px; height: 64px;
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
}
.ico svg { width: 30px; height: 30px; }
.ico.star { background: #4f7df5; color: #fff; }
.ico.x { background: #5b54e8; color: #fff; }
.ico.mega { background: #e07a3a; color: #fff; }
.feat span {
  font-size: 26px;
  font-weight: 650;
  letter-spacing: -0.03em;
  color: #f2f3f7;
  line-height: 1.2;
  white-space: nowrap;
}
</style></head><body>
<div class="card">
  <img class="logo" src="du-horizontal.png" alt="Digital Underground">
  <div class="title">MAKER PRO</div>
  <div class="tag">Get seen. Get promoted.</div>
  <div class="price-block">
    <div class="big-price">$9/mo · $79/yr</div>
    <div class="founding"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.62 5.7 6.26.86-4.55 4.36 1.14 6.22L12 16.86 6.53 19.74l1.14-6.22L3.12 9.16l6.26-.86L12 2.6z"/></svg>Founding 25: $59/yr</div>
  </div>
  <div class="features">
    <div class="feat"><div class="ico star"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.62 5.7 6.26.86-4.55 4.36 1.14 6.22L12 16.86 6.53 19.74l1.14-6.22L3.12 9.16l6.26-.86L12 2.6z"/></svg></div><span>Featured slots</span></div>
    <div class="feat"><div class="ico x"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.55 3.2h3.28l-5.67 6.48L18.9 20.8h-4.22l-3.7-7.28-4.22 7.28H2.5l6.08-6.95L2.35 3.2h4.3l3.36 6.68L14.55 3.2zm-1.15 15.9h1.82L8.55 4.95H6.6l6.8 14.15z"/></svg></div><span>DU X channels</span></div>
    <div class="feat"><div class="ico mega"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4.6 10.2v3.6c0 .5.4.9.9.9h1.7l4.4 3.5V6.8L7.2 10.2H5.5c-.5 0-.9.4-.9 1z"/><path d="M11.6 7.2c2.2-1.1 4.7-1.1 7.2.2v9.2c-2.5 1.3-5 .9-7.2-.2"/><path d="M7.4 15.8v1.6c0 1.4 1 2.6 2.4 2.8"/></svg></div><span>Promotion from DU</span></div>
  </div>
</div>
</body></html>
