<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Offer Desk promo preview</title>
<style>
:root{color-scheme:dark}
body{margin:0;font-family:system-ui,sans-serif;background:#0b0b10;color:#eee}
header{padding:20px 16px;max-width:960px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 6px}
p{margin:0;opacity:.75}
.grid{display:grid;gap:24px;padding:16px;max-width:960px;margin:0 auto;grid-template-columns:1fr}
@media(min-width:800px){.grid{grid-template-columns:1fr 1fr}}
figure{margin:0;background:#14141c;border-radius:16px;padding:12px;border:1px solid rgba(255,255,255,.08)}
figcaption{font-size:.85rem;opacity:.7;margin-bottom:8px}
video{width:100%;max-height:70vh;border-radius:12px;background:#000;display:block}
.v9{max-width:360px;margin:0 auto}
</style>
</head>
<body>
<header>
<h1>Offer Desk promo preview</h1>
<p>Phone remake v4 · ~21s · one-handed Install-from-receipt · vertical + square · not linked from the live store</p>
</header>
<div class="grid">
<figure>
<figcaption>9:16 vertical</figcaption>
<video class="v9" controls playsinline preload="metadata" src="offer-desk-promo-9x16.mp4"></video>
</figure>
<figure>
<figcaption>1:1 square</figcaption>
<video controls playsinline preload="metadata" src="offer-desk-promo-1x1.mp4"></video>
</figure>
</div>
</body>
</html>
