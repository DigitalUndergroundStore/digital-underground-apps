<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face {

@font-face {

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {

body {

}
.frame {
  width: 1200px; height: 630px;
  padding: 36px 40px;
  display: flex;
  align-items: stretch;
}
.card {
  flex: 1;

  gap: 36px;
  padding: 40px 44px;

  padding: 6px 0 2px;
}
.logo { width: 318px; }
.title {

  font-size: 108px;
  line-height: 0.86;
  letter-spacing: -0.045em;
  color: #fff;
  margin-top: 22px;
}
.tag {
  margin-top: 18px;
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: #c5c8d2;
}
.pills { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.price {
  background: #fff;
  color: #0c0b14;
  font-weight: 700;
  font-size: 24px;
  letter-spacing: -0.02em;
  padding: 10px 18px;
  border-radius: 999px;
  line-height: 1;
}
.founding {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(20, 40, 50, 0.72);
  color: #7ef0dc;
  font-weight: 650;
  font-size: 22px;
  letter-spacing: -0.01em;
  padding: 10px 16px 10px 14px;
  border-radius: 999px;
  border: 1px solid rgba(94, 234, 212, 0.35);
  line-height: 1;
}
.founding svg { width: 16px; height: 16px; color: #7ef0dc; flex: 0 0 auto; }
.tiles {
  width: 470px;
  flex: 0 0 470px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 16px;
}
.tile {
  display: flex;
  align-items: center;
  gap: 18px;
  background: rgba(28, 27, 40, 0.82);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 20px 22px;
  min-height: 88px;
}
.ico {
  width: 52px; height: 52px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;

}
.ico svg { width: 26px; height: 26px; }
.ico.star { background: #4f7df5; color: #fff; }
.ico.x { background: #5b54e8; color: #fff; }
.ico.mega { background: #e07a3a; color: #fff; }
.tile span {
  font-size: 30px;
  font-weight: 650;
  letter-spacing: -0.03em;
  color: #f4f5f8;
  line-height: 1.15;
}
