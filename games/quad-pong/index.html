<!DOCTYPE html>
<html lang="en"><head>

<style>
:root{--base:#0b0c12;--panel:rgba(26,20,24,.70);--ln:rgba(251,146,60,.16);--ln2:rgba(251,146,60,.4);--tx:#fff4ec;--mut:#bba7a0;--a1:#fb923c;--a2:#f43f5e;--a3:#fbbf24;--glow:rgba(251,113,61,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--base);color:var(--tx);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}button,select{cursor:pointer}
#klbg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#klfx{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.screen.on{display:flex;animation:klIn .28s ease-out}
@keyframes klIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#menu{justify-content:flex-start;overflow-y:auto;touch-action:pan-y}#menu>*{flex-shrink:0}#menu::before{content:"";flex:1 0 8px;max-height:9vh}
.brand{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--ln);background:rgba(255,255,255,.03);font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--mut)}
.brand::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--a1);box-shadow:0 0 8px var(--a1)}
h1{margin:14px 0 4px;font-size:clamp(34px,10vw,52px);line-height:.95;font-weight:900;letter-spacing:-.01em;text-align:center;background:linear-gradient(100deg,var(--a1),var(--a2) 55%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 24px var(--glow))}
.tag{color:var(--mut);font-weight:600;font-size:13px;margin-bottom:20px;text-align:center}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--ln);border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.lbl{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--mut);margin:0 0 6px 2px;text-transform:uppercase}
.name{margin-bottom:14px}.name input,.join input{width:100%;min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;outline:none;transition:border-color .15s}
.name input:focus,.join input:focus{border-color:var(--a1)}
.big{position:relative;display:block;width:100%;padding:17px 16px;border-radius:16px;border:0;background:linear-gradient(110deg,var(--a1),var(--a2));color:#0b0b14;font-weight:900;letter-spacing:.06em;font-size:18px;box-shadow:0 10px 30px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);margin-bottom:12px;overflow:hidden;transition:transform .12s,box-shadow .2s}
.big::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:klSheen 3.6s ease-in-out infinite}
@keyframes klSheen{60%,100%{transform:translateX(100%)}}
.big small{display:block;font-weight:600;letter-spacing:.02em;font-size:12px;opacity:.72;margin-top:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row+.row{margin-top:10px}
.btn{padding:13px 10px;border-radius:14px;border:1px solid var(--ln);background:rgba(255,255,255,.04);font-weight:700;font-size:14px;letter-spacing:.03em;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:rgba(255,255,255,.08);border-color:var(--ln2)}
.btn:active,.big:active{transform:scale(.97)}
.btn:focus-visible,.big:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.sep{display:flex;align-items:center;gap:10px;margin:16px 0 10px;font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--mut)}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--ln)}
.join{display:flex;gap:8px}.join input{text-align:center;letter-spacing:.42em;font-weight:900;font-size:18px;padding:11px}.join .btn{padding:0 18px}
.mini{font-size:12px;color:var(--mut);text-align:center;margin-top:14px}
.foot{font-size:11px;color:var(--mut);opacity:.7;margin:14px 0 4px;letter-spacing:.06em;text-align:center}
.lb{margin-top:16px;border-top:1px solid var(--ln);padding-top:12px}.lb h3{display:flex;justify-content:space-between;margin:0 0 8px;font-size:10px;letter-spacing:.2em;color:var(--mut)}.lb h3 b{color:var(--a1);letter-spacing:.05em}
.lb ol{list-style:none;margin:0;padding:0;max-height:132px;overflow:auto;counter-reset:r;font-size:13px}
.lb li{counter-increment:r;display:flex;gap:10px;padding:5px 4px;border-radius:8px}.lb li::before{content:counter(r);width:18px;text-align:right;color:var(--mut);font-weight:800}
.lb li.empty::before{content:none}.lb li:nth-child(1)::before{color:#fbbf24}.lb li:nth-child(2)::before{color:#cbd5e1}.lb li:nth-child(3)::before{color:#d97706}.lb li span{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--tx);font-weight:700}
.code{font-size:52px;font-weight:900;letter-spacing:.28em;padding-left:.28em;background:linear-gradient(100deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
.spin{width:40px;height:40px;border:3px solid var(--ln);border-top-color:var(--a1);border-radius:50%;animation:sp 1s linear infinite;margin:14px auto}@keyframes sp{to{transform:rotate(360deg)}}
.over{position:fixed;inset:0;background:rgba(4,4,10,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:15;padding:16px}
.over.on{display:flex;animation:klIn .3s ease-out}.over .card{text-align:center}.over h2{font-size:40px;font-weight:900;margin:10px 0 4px;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}.stats div{background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:12px;padding:8px 4px;font-size:10px;letter-spacing:.14em;color:var(--mut)}.stats b{display:block;font-size:18px;color:var(--tx);letter-spacing:0}
.toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);background:var(--panel);border:1px solid var(--ln2);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;display:none;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.ico{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--ln);background:rgba(0,0,0,.25);font-size:15px;padding:0}
select{color:#e6fbff;background-color:#0e1220;color-scheme:dark;-webkit-appearance:menulist;appearance:auto}
select option{color:#e6fbff;background-color:#0e1220}
#diff{font-weight:800;border-width:1px;border-style:solid}
#diff option[value="0"]{color:#4ade80}#diff option[value="1"]{color:#fbbf24}#diff option[value="2"]{color:#f87171}#diff option[value="3"]{color:#e879f9}
#klcd{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:25}
#klcd span{font-size:min(42vw,240px);font-weight:900;color:#fff;line-height:1;text-shadow:0 0 30px var(--a1),0 0 80px var(--glow);animation:klCd .95s cubic-bezier(.2,1.4,.4,1) forwards}
#klcd span.go{color:var(--a1);font-size:min(30vw,190px);animation-duration:.8s}
@keyframes klCd{0%{transform:scale(2.4);opacity:0}18%{transform:scale(.92);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:scale(.8);opacity:0}}
.klflash{position:fixed;inset:0;pointer-events:none;z-index:19;transition:opacity .4s ease-out}
.klpop{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:22;font-weight:900;font-size:18px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.35),0 3px 14px rgba(0,0,0,.65);animation:klPop 1.1s ease-out forwards;white-space:nowrap}
.klpop.lg{font-size:clamp(20px,6.4vw,30px)}
@keyframes klPop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-120%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.big::after{display:none}#klcd span{animation:none}}

#menu{justify-content:flex-start}#lobby{justify-content:center;text-align:center}#lobby h2{margin:14px 0 0;font-size:20px;font-weight:800}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(380px,100%);margin:12px 0}
.seats div{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:14px;border:1px solid var(--ln);background:var(--panel);font-weight:700;font-size:13px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.seats div::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}.seats div.open{opacity:.5}
#game{padding:6px;justify-content:center}
.hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--mut);z-index:2;pointer-events:none}
.hud button{pointer-events:auto}
#hudMode{padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--ln)}
canvas#c{display:block;touch-action:none;border-radius:18px;box-shadow:0 0 0 1px var(--ln2),0 0 60px var(--glow),0 30px 80px rgba(0,0,0,.5)}
.hint{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;font-weight:600;color:var(--mut);pointer-events:none;animation:klIn .4s}
</style></head>
<body>
<section id="menu" class="screen on">
  <div class="brand">KERZY LABS</div><h1>QUAD<br>PONG</h1><div class="tag">Four walls. One survivor. Last wall standing wins.</div>
  <div class="card">
    <div class="name"><label class="lbl" for="nm">Name</label><input id="nm" maxlength="12" autocomplete="off" spellcheck="false"></div>
    <button class="big" id="bQuick">QUICK MATCH<small>Online · up to 4 players · bots fill empty walls</small></button>
    <div class="row"><button class="btn" id="bSolo">SOLO VS 3 BOTS</button><button class="btn" id="bHost">PLAY FRIENDS</button></div>
    <div class="row"><select class="btn" id="diff" aria-label="Bot difficulty"><option value="0">Bots: Easy</option><option value="1" selected>Bots: Normal</option><option value="2">Bots: Hard</option></select><select class="btn" id="lives" aria-label="Lives"><option value="3">3 lives</option><option value="5" selected>5 lives</option><option value="8">8 lives</option></select></div>
    <div class="sep">GOT A ROOM CODE?</div>
    <div class="join"><input id="code" maxlength="4" placeholder="CODE" autocomplete="off" aria-label="Room code"><button class="btn" id="bJoin">JOIN</button></div>
    <div class="lb"><h3>SOLO WINS · GLOBAL TOP <b id="pb"></b></h3><ol id="lbList"><li class="empty">Loading…</li></ol></div>
  </div>
  <div class="foot"><button class="ico" id="bMute" aria-label="Sound" style="width:auto;height:auto;padding:4px 10px;font-size:11px;border-radius:99px">SOUND ON</button><br><span style="display:inline-block;margin-top:10px">You always defend the bottom wall · © 2026 Kerzy Labs</span></div>
</section>
<section id="lobby" class="screen">
  <div class="brand">KERZY LABS</div><h2 id="lobT">Room</h2><div class="code" id="lobCode">····</div>
  <div class="seats" id="seats"></div><p id="lobMsg" class="mini" style="font-size:14px"></p>
  <div class="row" style="width:min(380px,100%)"><button class="btn" id="bShare">SHARE LINK</button><button class="btn" id="bStart">START NOW</button></div>
  <button class="btn" id="bLobBack" style="margin-top:10px;width:min(380px,100%)">BACK</button>
</section>
<section id="game" class="screen">
  <div class="hud"><button class="ico" id="bQuit" aria-label="Quit">✕</button><span id="hudMode"></span><button class="ico" id="bSnd" aria-label="Sound">♪</button></div>
  <canvas id="c"></canvas><div class="hint" id="hint">Drag anywhere to move your paddle</div>
</section>
<div class="over" id="over"><div class="card"><div class="brand" id="ovSub">MATCH OVER</div><h2 id="ovT">YOU WIN</h2><p id="ovMsg" class="mini" style="font-size:14px;margin-top:4px"></p><div class="stats"><div>TIME<b id="stT">0:00</b></div><div>SAVES<b id="stH">0</b></div><div>MAX BALLS<b id="stB">1</b></div></div><div class="row" style="margin-top:12px"><button class="big" id="bAgain" style="margin:0;font-size:15px;padding:14px">PLAY AGAIN</button><button class="btn" id="bMenu">MENU</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
/* Kerzy Labs realtime relay client. Seats assigned by server; host = lowest seat. */
const KLNet = (() => {
  const API = "https://du-games.digitalunderground-store.workers.dev";
  async function get(path) { const r = await fetch(API + path, { cache: "no-store" }); if (!r.ok) throw new Error("server " + r.status); return r.json(); }
  function connect(game, room, name, h) {
    const ws = new WebSocket(API.replace(/^http/, "ws") + "/ws?game=" + game + "&room=" + encodeURIComponent(room) + "&name=" + encodeURIComponent(name || ""));
    const c = { room, seat: -1, host: -1, seats: [], open: false, closed: false,
      send(d, to) { if (ws.readyState === 1) ws.send(JSON.stringify(to == null ? { d } : { d, to })); },
      close() { c.closed = true; try { ws.close(); } catch (e) {} },
      get isHost() { return c.seat >= 0 && c.seat === c.host; } };
    let pingT = null;
    ws.onopen = () => { c.open = true; pingT = setInterval(() => { if (ws.readyState === 1) ws.send(JSON.stringify({ t: "ping", at: Date.now() })); }, 20000); };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m.t === "hello") { c.seat = m.seat; c.cap = m.cap; h.hello && h.hello(c); }
      else if (m.t === "roster") { c.seats = m.seats; c.host = m.host; h.roster && h.roster(c); }
      else if (m.t === "m") h.msg && h.msg(m.from, m.d, c);
      else if (m.t === "full") h.error && h.error("That room is full.");
    };
    ws.onclose = () => { clearInterval(pingT); if (!c.closed) h.closed && h.closed(c); };
    ws.onerror = () => { h.error && h.error("Could not reach the game server."); };
    return c;
  }
  return {
    quick: (game) => get("/quick?game=" + game).then((r) => r.room),
    newRoom: (game) => get("/new?game=" + game).then((r) => r.room),
    connect,
    scores: (game, board) => get("/scores?game=" + game + "&board=" + board).catch(() => ({ top: [] })),
    submit: (game, board, name, score) => fetch(API + "/scores?game=" + game + "&board=" + board, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, score }) }).then((r) => r.json()).catch(() => null),
    roomFromUrl() { try { const r = (new URLSearchParams(location.search).get("room") || "").toUpperCase(); return /^[A-Z0-9]{4}$/.test(r) ? r : ""; } catch (e) { return ""; } },
    shareUrl(room, publicUrl) { const onItch = /(^|\.)itch\.(io|zone)$/i.test(location.hostname); const base = onItch || location.protocol === "file:" ? publicUrl : location.href.split("?")[0].split("#")[0]; return base + "?room=" + room; },
  };
})();

/* Kerzy Labs shared FX: animated background, particles, screen shake, crowd countdown. Small and phone-friendly. */
const KLFX = (() => {
  const RM = matchMedia("(prefers-reduced-motion: reduce)");
  const reduced = () => RM.matches;
  const lowEnd = (navigator.hardwareConcurrency || 4) <= 4 || Math.min(innerWidth, innerHeight) < 500;
  let muted = localStorage.getItem("kl_mute") === "1";

  /* ---------- background: drifting gradient blobs + slow particles ---------- */
  function bg(pal) {
    const c = document.createElement("canvas"); c.id = "klbg"; c.setAttribute("aria-hidden", "true");
    document.body.prepend(c); const x = c.getContext("2d"); let W = 0, H = 0, dpr = 1;
    const N = lowEnd ? 26 : 50, dots = [];
    const fit = () => { dpr = Math.min(1.5, devicePixelRatio || 1); W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); };
    fit(); addEventListener("resize", fit);
    for (let i = 0; i < N; i++) dots.push({ x: Math.random(), y: Math.random(), z: 0.3 + Math.random() * 0.7, c: pal.dots[i % pal.dots.length], p: Math.random() * 6.28 });
    let t0 = performance.now(), lastF = 0, px = 0, py = 0;
    addEventListener("pointermove", (e) => { px = e.clientX / W - 0.5; py = e.clientY / H - 0.5; }, { passive: true });
    function frame(now) {
      if (!reduced()) requestAnimationFrame(frame);
      if (document.hidden || now - lastF < 33) return; lastF = now; const t = (now - t0) / 1000;
      x.fillStyle = pal.base; x.fillRect(0, 0, W, H);
      pal.blobs.forEach((b, i) => { const bx = W * (0.5 + 0.38 * Math.sin(t * 0.05 * (i + 1) + i * 2)), by = H * (0.45 + 0.35 * Math.cos(t * 0.04 * (i + 1.3) + i));
        const r = Math.max(W, H) * 0.55; const g = x.createRadialGradient(bx, by, 0, bx, by, r); g.addColorStop(0, b); g.addColorStop(1, "transparent"); x.fillStyle = g; x.fillRect(0, 0, W, H); });
      x.globalCompositeOperation = "lighter";
      for (const d of dots) { d.y -= 0.00025 * d.z * (reduced() ? 0 : 1); if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); }
        const sx = (d.x + px * 0.03 * d.z) * W, sy = (d.y + py * 0.03 * d.z) * H, a = 0.25 + 0.35 * Math.sin(t * 1.3 + d.p) ** 2;
        x.globalAlpha = a * d.z; x.fillStyle = d.c; x.beginPath(); x.arc(sx, sy, 1 + d.z * 1.6, 0, 6.29); x.fill(); }
      x.globalAlpha = 1; x.globalCompositeOperation = "source-over";
    }
    requestAnimationFrame(frame); RM.addEventListener && RM.addEventListener("change", () => requestAnimationFrame(frame));
  }

  /* ---------- particles overlay (client px) ---------- */
  const fx = document.createElement("canvas"); fx.id = "klfx"; fx.setAttribute("aria-hidden", "true"); const fc = fx.getContext("2d"); let parts = [], running = false;
  const fitFx = () => { const d = Math.min(2, devicePixelRatio || 1); fx.width = innerWidth * d; fx.height = innerHeight * d; fc.setTransform(d, 0, 0, d, 0, 0); };
  addEventListener("resize", fitFx);
  function tick() { fc.clearRect(0, 0, innerWidth, innerHeight); fc.globalCompositeOperation = "lighter";
    parts = parts.filter((p) => (p.l -= 1 / 60) > 0);
    for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.985; const a = Math.min(1, p.l / p.l0 * 1.4);
      fc.globalAlpha = a; fc.fillStyle = p.c; if (p.r > 2.6) { fc.beginPath(); fc.arc(p.x, p.y, p.r * a, 0, 6.29); fc.fill(); } else fc.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); }
    fc.globalAlpha = 1; fc.globalCompositeOperation = "source-over";
    if (parts.length) requestAnimationFrame(tick); else running = false; }
  function burst(x, y, color, n = 14, o = {}) {
    if (!fx.isConnected) { document.body.appendChild(fx); fitFx(); }
    const k = reduced() ? 0.3 : lowEnd ? 0.6 : 1; n = Math.max(1, Math.round(n * k)); const sp = o.speed || 3.2;
    for (let i = 0; i < n; i++) { const a = o.dir != null ? o.dir + (Math.random() - 0.5) * (o.spread || 1.4) : Math.random() * 6.29, v = sp * (0.35 + Math.random());
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.g == null ? 0.06 : o.g, r: (o.size || 1.8) * (0.6 + Math.random() * 0.8), c: Array.isArray(color) ? color[i % color.length] : color, l: (o.life || 0.6) * (0.6 + Math.random() * 0.6), l0: o.life || 0.6 }); }
    if (parts.length > 500) parts.splice(0, parts.length - 500);
    if (!running) { running = true; requestAnimationFrame(tick); } }

  /* ---------- screen shake ---------- */
  const shakes = new Map();
  function shake(el, mag = 6, ms = 220) { if (!el || reduced()) return; const t0 = performance.now(); const prev = shakes.get(el); if (prev && prev.mag > mag) return;

addEventListener("keyup", (e) => { if (["ArrowLeft", "KeyA", "ArrowRight", "KeyD"].includes(e.code)) S.keys = 0; });
function applyInput(dt) { if (S.keys) { S.input = Math.max(0, Math.min(1, S.input + S.keys * 1.3 * dt)); S.pointer = false; } return myWorldPos(S.input); }

/* --- loop --- */
let last = performance.now();
function loop(t) { requestAnimationFrame(loop); const dt = Math.min(0.05, (t - last) / 1000); last = t; if (!S.running) return;
  const me = S.players[S.mySeat]; const want = applyInput(dt);
  if (S.mode === "solo" || (S.mode === "online" && S.net && S.net.isHost)) { if (me && me.alive) me.pos += (want - me.pos) * Math.min(1, dt * 25);
    for (let sub = 0; sub < 3; sub++) step(dt / 3);
    if (S.mode === "online" && t - S.lastSend > 45) { S.lastSend = t; S.net.send({ st: pack() }); } }
  else if (S.mode === "online") { if (me && me.alive) me.pos += (want - me.pos) * Math.min(1, dt * 25); if (t - S.lastSend > 45) { S.lastSend = t; S.net.send({ in: +me.pos.toFixed(4) }); }
    for (const b of S.balls) { b.x += b.vx * dt; b.y += b.vy * dt; } if (S.countdown > 0) S.countdown -= dt; }
  const n = S.countdown > 0 ? Math.ceil(S.countdown) : 0; if (n !== S.prevN) { if (n > 0 && n <= 3) KLFX.beat(n, "#fb923c"); else if (n === 0 && S.prevN > 0) KLFX.beat(0, "#fb923c"); S.prevN = n; }
  draw(dt); }
requestAnimationFrame(loop);
function pack() { return { p: S.players.map((p) => [+p.pos.toFixed(4), p.lives, p.alive ? 1 : 0, p.bot ? 1 : 0]), b: S.balls.map((b) => [+b.x.toFixed(4), +b.y.toFixed(4), +b.vx.toFixed(4), +b.vy.toFixed(4)]), c: +S.countdown.toFixed(2), n: S.names }; }
function unpack(st) { st.p.forEach((a, i) => { const p = S.players[i] || (S.players[i] = {}); if (i !== S.mySeat || !p.alive) p.pos = a[0]; if (p.lives > a[1] && p.lives != null) flash(i); p.lives = a[1]; const was = p.alive; p.alive = !!a[2]; p.bot = !!a[3]; p.name = (st.n && st.n[i]) || (p.bot ? "BOT " + (i + 1) : "PLAYER " + (i + 1)); });
  S.balls = st.b.map((a) => ({ x: a[0], y: a[1], vx: a[2], vy: a[3] })); S.countdown = st.c; }

function startSolo() { leaveNet(); S.mode = "solo"; S.mySeat = 0; S.names = [nm.value, "BOT 2", "BOT 3", "BOT 4"]; newMatch([0], +$("lives").value, +$("diff").value); go(); }
function go() { $("over").classList.remove("on"); show("game"); size(); S.running = true; S.input = 0.5; S.prevN = -1; KLFX.resetBeat(); S.saves = 0; S.maxBalls = 1; S.t0 = performance.now(); prevB.length = 0; prevL.length = 0; trails.length = 0; prevCount = 0; $("hudMode").textContent = S.mode === "solo" ? "SOLO" : "ONLINE · " + S.net.room; $("hint").style.display = ""; setTimeout(() => ($("hint").style.display = "none"), 5000); }
function endMatch(result) { if (!S.running) return; S.running = false; KLFX.cancelCountdown();
  const secs = Math.round((performance.now() - (S.t0 || performance.now())) / 1000); $("stT").textContent = Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0"); $("stH").textContent = S.saves || 0; $("stB").textContent = S.maxBalls || 1; const P = S.players; const winner = result != null ? result : P.findIndex((p) => p.alive);
  if (S.mode === "online" && S.net && S.net.isHost) S.net.send({ end: winner, st: pack() });
  const won = winner === S.mySeat; $("over").classList.add("on"); $("ovSub").textContent = S.mode === "solo" ? "SOLO MATCH" : "ONLINE MATCH"; $("ovT").textContent = won ? "YOU WIN" : "YOU LOSE"; $("ovT").style.color = won ? "var(--a1)" : "#f43f5e"; KLFX.sfx(won ? "win" : "lose"); if (won) for (let i = 0; i < 6; i++) setTimeout(() => KLFX.burst(innerWidth * (.2 + Math.random() * .6), innerHeight * (.25 + Math.random() * .3), ["#fb923c", "#fbbf24", "#2dd4bf", "#fb7185"], 22, { speed: 5, life: 1.1 }), i * 140);
  $("ovMsg").textContent = winner >= 0 ? (won ? "Last wall standing." : (P[winner] ? P[winner].name : "Someone") + " was the last wall standing.") : "Draw.";
  if (S.mode === "solo" && won) { S.wins++; localStorage.setItem("qp_wins", S.wins); $("ovMsg").textContent += " Solo wins: " + S.wins + "."; KLNet.submit("qp", "solo-wins", nm.value, S.wins).then(loadLb); }
  $("bAgain").textContent = S.mode === "online" ? (S.net && S.net.isHost ? "REMATCH" : "WAIT FOR HOST") : "PLAY AGAIN"; }

/* --- online --- */
function renderSeats(c) { const box = $("seats"); box.innerHTML = ""; for (let i = 0; i < 4; i++) { const s = c.seats.find((x) => x.seat === i); const d = document.createElement("div"); d.style.color = COL[i]; if (!s) d.className = "open"; d.textContent = s ? (s.name || "PLAYER " + (i + 1)) + (i === c.seat ? " (you)" : "") + (i === c.host ? " ★" : "") : "Open · bot fills"; box.appendChild(d); } }
let autoT = null;
async function goOnline(kind, code) { leaveNet(); let room = code; show("lobby"); $("lobT").textContent = kind === "quick" ? "Quick Match" : "Friends room"; $("lobCode").textContent = code || "····"; $("lobMsg").textContent = "Connecting…"; $("seats").innerHTML = "";
  try { if (!room) room = kind === "quick" ? await KLNet.quick("qp") : await KLNet.newRoom("qp"); } catch (e) { toast("Game server unreachable. Try solo.", 3000); show("menu"); return; }
  $("lobCode").textContent = room; history.replaceState(null, "", location.pathname + "?room=" + room); S.kind = kind;
  S.net = KLNet.connect("qp", room, nm.value, {
    roster(c) { renderSeats(c); S.names = [0, 1, 2, 3].map((i) => { const s = c.seats.find((x) => x.seat === i); return s ? s.name || "PLAYER " + (i + 1) : "BOT " + (i + 1); });
      $("bStart").style.display = c.isHost ? "" : "none"; const n = c.seats.length;
      if (S.running && c.isHost) { S.players.forEach((p, i) => { const here = c.seats.some((x) => x.seat === i); if (p.human && !here) { p.human = false; p.bot = true; p.name = "BOT " + (i + 1); } }); }
      if (!S.running) { $("lobMsg").textContent = c.isHost ? (n > 1 ? n + " players here. Start now, or it starts when the room fills." : "Waiting for players… share the link. Start any time; bots fill empty walls.") : "Waiting for the host to start…";
        clearTimeout(autoT); if (c.isHost && kind === "quick" && n > 1) autoT = setTimeout(hostStart, n >= 4 ? 1500 : 12000); if (c.isHost && n >= 4) autoT = setTimeout(hostStart, 1500); } },
    msg(from, d, c) { if (d.go && !c.isHost) { S.mode = "online"; S.mySeat = c.seat; S.players = []; unpack(d.go); go(); }
      if (d.st && !c.isHost && S.running) unpack(d.st);
      if (d.in != null && c.isHost && S.players[from] && S.players[from].alive) S.players[from].pos = Math.max(PW / 2, Math.min(1 - PW / 2, +d.in));
      if (d.end != null && !c.isHost) { if (d.st) unpack(d.st); endMatch(d.end); } },
    error(t) { toast(t, 3000); }, closed() { toast("Disconnected.", 2500); if (S.running) { S.running = false; show("menu"); } },
  }); }
function hostStart() { const c = S.net; if (!c || !c.isHost || S.running) return; clearTimeout(autoT); S.mode = "online"; S.mySeat = c.seat; newMatch(c.seats.map((s) => s.seat), +$("lives").value, +$("diff").value); c.send({ go: pack() }); go(); }
function leaveNet() { clearTimeout(autoT); if (S.net) { S.net.close(); S.net = null; } if (location.search) history.replaceState(null, "", location.pathname); }
$("bSolo").onclick = startSolo; $("bQuick").onclick = () => goOnline("quick"); $("bHost").onclick = () => goOnline("host"); $("bStart").onclick = hostStart;
$("bJoin").onclick = () => { const c = $("code").value.toUpperCase().replace(/[^A-Z0-9]/g, ""); if (c.length !== 4) { toast("Enter the 4-character room code."); return; } goOnline("join", c); };
$("bLobBack").onclick = () => { leaveNet(); show("menu"); };
$("bShare").onclick = async () => { if (!S.net) return; const url = KLNet.shareUrl(S.net.room, PUBLIC_URL); const text = "Join my Quad Pong room " + S.net.room;
  try { if (navigator.share) { await navigator.share({ title: "Quad Pong", text, url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(url); toast("Link copied", 2000); } catch (e) { prompt("Copy this link", url); } };
$("bQuit").onclick = () => { S.running = false; KLFX.cancelCountdown(); leaveNet(); show("menu"); loadLb(); };
$("bMenu").onclick = () => { $("over").classList.remove("on"); leaveNet(); show("menu"); loadLb(); };
$("bAgain").onclick = () => { if (S.mode === "solo") startSolo(); else if (S.net && S.net.isHost) { $("over").classList.remove("on"); hostStart(); } else if (!S.net) goOnline("quick"); };
const paintMute = () => { $("bMute").textContent = KLFX.muted ? "SOUND OFF" : "SOUND ON"; $("bSnd").style.opacity = KLFX.muted ? .4 : 1; }; paintMute();
$("bSnd").onclick = $("bMute").onclick = () => { KLFX.setMuted(!KLFX.muted); paintMute(); KLFX.sfx("ui"); };
function loadLb() { KLNet.scores("qp", "solo-wins").then((d) => { const l = $("lbList"); const top = (d.top || []).slice(0, 10); l.innerHTML = top.length ? "" : "<li class=\"empty\">No wins yet. Be the first.</li>"; for (const r of top) { const li = document.createElement("li"); li.textContent = r.name; const sp = document.createElement("span"); sp.textContent = r.score + (r.score === 1 ? " win" : " wins"); li.appendChild(sp); l.appendChild(li); } });
  $("pb").textContent = S.wins ? "YOU " + S.wins : ""; }
loadLb(); const incoming = KLNet.roomFromUrl(); if (incoming) goOnline("join", incoming);
window.__qp = S;
})();

(() => { const d = document.getElementById("diff"); if (!d) return; const C = ["#4ade80", "#fbbf24", "#f87171", "#e879f9"];
  const paint = () => { const c = C[+d.value] || C[1]; d.style.color = c; d.style.borderColor = c; d.style.boxShadow = "0 0 10px " + c + "40"; };
  d.addEventListener("change", paint); d.addEventListener("input", paint); paint(); })();
</script>
