<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DU Command — Owner</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#030712">
<link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg">
<style>
  :root {
    --bg0: #030712;
    --bg1: #07111f;
    --cyan: #4cc9ff;
    --violet: #7c5cff;
    --text: #e8f4ff;
    --muted: #7f9bb8;
    --line: rgba(76, 201, 255, 0.28);
    --ok: #3dffb0;
    --warn: #ffb020;
    --panel: rgba(6, 16, 32, 0.78);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg0);
    overflow: hidden;
  }
  body::before, body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  body::before {
    background:
      radial-gradient(ellipse 55% 45% at 50% 42%, rgba(90, 50, 220, 0.35), transparent 60%),
      radial-gradient(ellipse 40% 35% at 50% 48%, rgba(40, 160, 255, 0.22), transparent 55%),
      radial-gradient(circle at 50% 100%, rgba(0,0,0,0.85), transparent 45%),
      linear-gradient(180deg, #02040a, #06101c 50%, #02040a);
  }
  body::after {
    opacity: 0.55;
    background-image:
      linear-gradient(rgba(90,160,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90,160,255,0.05) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(circle at 50% 45%, #000 20%, transparent 72%);
  }
  .app { position: relative; z-index: 1; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
  .top {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 14px 8px; padding-top: max(12px, env(safe-area-inset-top));
  }
  .brand {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 800;
    color: var(--cyan); text-shadow: 0 0 18px rgba(76,201,255,0.45);
  }
  .brand small { display: block; margin-top: 3px; color: var(--muted); letter-spacing: 0.14em; font-weight: 600; font-size: 10px; }
  .top-right { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    border: 1px solid var(--line); background: rgba(0,0,0,0.4); color: var(--text);
    border-radius: 999px; padding: 7px 11px; font-size: 12px; cursor: pointer; text-decoration: none;
  }
  .chip.on { border-color: var(--cyan); background: rgba(76,201,255,0.16); box-shadow: 0 0 16px rgba(76,201,255,0.2); }
  .main {
    display: grid; grid-template-columns: minmax(260px, 1fr) minmax(280px, 1.15fr) minmax(260px, 1fr);
    gap: 12px; padding: 0 12px; min-height: 0;
  }
  .panel {
    min-height: 0; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: inset 0 0 40px rgba(76,201,255,0.05), 0 0 30px rgba(20,40,80,0.35);
    backdrop-filter: blur(12px);
  }
  .panel h2 {
    margin: 0; padding: 12px 14px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--cyan); border-bottom: 1px solid rgba(76,201,255,0.18);
  }
  .list { overflow: auto; padding: 8px; flex: 1; -webkit-overflow-scrolling: touch; }
  .item {
    display: grid; grid-template-columns: 10px 1fr; gap: 8px 10px;
    padding: 10px; border-radius: 14px; margin-bottom: 6px;
    background: rgba(255,255,255,0.03); border: 1px solid transparent;
  }
  .item:hover { border-color: rgba(76,201,255,0.25); background: rgba(76,201,255,0.07); }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--ok); box-shadow: 0 0 10px currentColor; }
  .dot.warn { background: var(--warn); color: var(--warn); }
  .dot.idle { background: var(--muted); box-shadow: none; }
  .item strong { font-size: 13px; display: block; }
  .item .d { font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
  .wait .item { grid-template-columns: 1fr; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn {
    border: 1px solid var(--line); background: rgba(0,0,0,0.35); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .btn.ok { border-color: rgba(61,255,176,0.45); color: var(--ok); }
  .btn.later { color: var(--muted); }
  .center {
    min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; padding: 8px;
  }
  .orb-wrap {
    position: relative; width: min(260px, 58vw); aspect-ratio: 1;
    display: grid; place-items: center;
  }
  .ring {
    position: absolute; border-radius: 50%; border: 1px solid rgba(120,180,255,0.28);
    inset: 0; animation: spin 22s linear infinite;
  }
  .ring.r2 { inset: 10%; border-style: dashed; opacity: 0.65; animation-duration: 30s; animation-direction: reverse; }
  .ring.r3 { inset: 20%; border-color: rgba(124,92,255,0.4); animation-duration: 14s; }
  .orb {
    width: 54%; height: 54%; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 32% 28%, #d8f0ff, #5a8cff 38%, #6a3dff 68%, #0a1030 100%);
    box-shadow: 0 0 50px rgba(90,130,255,0.7), 0 0 120px rgba(90,40,255,0.4), inset 0 0 36px rgba(255,255,255,0.28);
    animation: pulse 3.2s ease-in-out infinite;
  }
  .orb img { width: 44%; height: auto; filter: drop-shadow(0 0 14px rgba(255,255,255,0.5)); }
  .line {
    margin: 18px 8px 0; text-align: center; max-width: 420px; min-height: 3.2em;
    font-size: 14px; line-height: 1.45; text-shadow: 0 0 18px rgba(0,0,0,0.8);
  }
  .dock {
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
    background: linear-gradient(transparent, rgba(3,7,18,0.92) 28%);
  }
  .ask {
    display: flex; gap: 8px; align-items: center;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(0,0,0,0.55);
    padding: 8px 10px 8px 16px; box-shadow: 0 0 24px rgba(76,201,255,0.12);
  }
  .ask input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 15px; }
  .ask input::placeholder { color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tabs { display: none; gap: 8px; padding: 0 12px 8px; }
  .tabs .chip { flex: 1; text-align: center; }
  body.focus .panel { opacity: 0.22; filter: saturate(0.55); pointer-events: none; }
  body.focus #btn-focus { border-color: var(--cyan); background: rgba(76,201,255,0.2); }
  .gate {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
    background: rgba(2,5,12,0.94); text-align: center; padding: 24px;
  }
  .gate.hidden { display: none; }
  .gate a { color: var(--cyan); }
  @keyframes pulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.045);} }
  @keyframes spin { to { transform: rotate(360deg);} }

  /* Phone: orb first, then one panel via tabs */
  @media (max-width: 920px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100dvh; }
    .tabs { display: flex; }
    .main {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(220px, 38vh);
      padding-bottom: 0;
    }
    .center { order: -1; padding-top: 4px; }
    .orb-wrap { width: min(210px, 56vw); }
    .panel { max-height: 38vh; }
    .panel[data-pane="systems"].off,
    .panel[data-pane="waiting"].off { display: none; }
    .line { font-size: 13px; margin-top: 12px; }
  }
</style>
</head>
<body>
<div id="gate" class="gate">
  <div>
    <p class="brand" style="margin:0 0 10px">DU Command</p>
    <p style="color:var(--muted);max-width:340px;margin:0 auto 16px">Owner session required. Sign in on the owner dashboard, then reopen this page.</p>
    <a class="chip" href="/owner/">Open owner home</a>
  </div>
</div>
<div class="app">
  <header class="top">
    <div class="brand">DU Command<small>HUD · private</small></div>
    <div class="top-right">
      <button type="button" class="chip on" id="btn-voice" aria-pressed="true">Voice: on</button>
      <a class="chip" href="/owner/">← Owner home</a>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" class="chip on" data-tab="systems" aria-selected="true">Systems</button>
    <button type="button" class="chip" data-tab="waiting" aria-selected="false">Waiting</button>
  </div>

  <div class="main">
    <aside class="panel" data-pane="systems" aria-label="Systems">
      <h2 id="sys-title">Systems — …</h2>
      <div class="list" id="sys-list"></div>
    </aside>

    <section class="center" aria-live="polite">
      <div class="orb-wrap" aria-hidden="true">
        <div class="ring"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="orb"><img src="/assets/logo/du-mark.svg" alt="" width="72" height="72"></div>
      </div>
      <p class="line" id="line">Initializing…</p>
    </section>

    <aside class="panel wait" data-pane="waiting" aria-label="Waiting on you">
      <h2 id="wait-title">Waiting on you — …</h2>
      <div class="list" id="wait-list"></div>
    </aside>
  </div>

  <footer class="dock">
    <div class="ask">
      <input id="ask" type="text" placeholder="Ask Jarvis…" autocomplete="off" enterkeyhint="send">
      <button type="button" class="btn" id="btn-ask">Send</button>
    </div>
    <div class="pills">
      <button type="button" class="chip" data-q="Morning brief">Morning brief</button>
      <button type="button" class="chip" data-q="Status">Status</button>
      <button type="button" class="chip" data-q="What's reading">What's reading</button>
      <button type="button" class="chip" id="btn-focus">Focus mode</button>
    </div>
  </footer>
</div>
<script>
(function () {
  var SYSTEMS = [
    { name: "Gerold", status: "ok", detail: "CEO desk · site deploys, Buffer, X drafts" },
    { name: "Jarvis", status: "ok", detail: "Morning plate weekdays 8am ET · triage hub" },
    { name: "Scout", status: "warn", detail: "Digs paused until Writer needs stock" },
    { name: "Writer", status: "ok", detail: "Outreach READY sends · Writer-gated digs" },
    { name: "Store", status: "ok", detail: "Gumroad USD kits · Coming soon queue Nov 2" },
    { name: "Content", status: "ok", detail: "USD marketing copy + League pitch rebrand" },
    { name: "Buffer", status: "ok", detail: "Grow every 30m · refill hourly · queue full" },
    { name: "League", status: "ok", detail: "Week 2 live · best product, most votes" },
    { name: "QC", status: "idle", detail: "No open product reviews" },
    { name: "Director", status: "idle", detail: "No active video brief" }
  ];
  var WAITING = [
    { id: "w1", who: "You", text: "Pin Week 2 Maker League post (or keep grow pin)" },
    { id: "w2", who: "Build", text: "Maker inbox v1 — authorized, not started" },
    { id: "w3", who: "Stripe", text: "Stripe setup still paused — resume when ready" },
    { id: "w4", who: "GitHub", text: "GSAHavok suspension — ticket #4889640 awaiting reply" }
  ];
  var later = JSON.parse(localStorage.getItem("du_cmd_later") || "[]");
  var done = JSON.parse(localStorage.getItem("du_cmd_done") || "[]");
  function $(id) { return document.getElementById(id); }
  function say(t) { $("line").textContent = t; }

  function renderSys(extra) {
    var list = SYSTEMS.slice();
    if (extra) list = extra.concat(list);
    $("sys-title").textContent = "Systems — " + list.length + " active";
    $("sys-list").innerHTML = list.map(function (s) {
      var cls = s.status === "warn" ? "warn" : s.status === "idle" ? "idle" : "";
      return '<div class="item"><i class="dot ' + cls + '"></i><div><strong>' + s.name + '</strong><div class="d">' + s.detail + '</div></div></div>';
    }).join("");
  }
  function renderWait() {
    var items = WAITING.filter(function (w) { return later.indexOf(w.id) < 0 && done.indexOf(w.id) < 0; });
    $("wait-title").textContent = "Waiting on you — " + items.length;
    $("wait-list").innerHTML = items.map(function (w) {
      return '<div class="item" data-id="' + w.id + '"><div><strong>' + w.who + '</strong><div class="d">' + w.text + '</div><div class="actions">' +
        '<button type="button" class="btn ok" data-act="ok">Approve</button>' +
        '<button type="button" class="btn later" data-act="later">Later</button></div></div></div>';
    }).join("") || '<div class="item"><div><strong>Clear</strong><div class="d">Nothing waiting right now.</div></div></div>';
  }

  $("wait-list").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var id = b.closest("[data-id]").getAttribute("data-id");
    if (b.getAttribute("data-act") === "later") {
      later.push(id); localStorage.setItem("du_cmd_later", JSON.stringify(later)); say("Parked for later.");
    } else {
      done.push(id); localStorage.setItem("du_cmd_done", JSON.stringify(done));
      say("Marked handled locally. Tell Gerold in chat for real work.");
    }
    renderWait();
  });

  document.querySelectorAll(".tabs [data-tab]").forEach(function (tab) {
    tab.addEventListener("click", function () {
      var name = tab.getAttribute("data-tab");
      document.querySelectorAll(".tabs [data-tab]").forEach(function (t) {
        var on = t === tab; t.classList.toggle("on", on); t.setAttribute("aria-selected", String(on));
      });
      document.querySelectorAll(".panel[data-pane]").forEach(function (p) {
        p.classList.toggle("off", p.getAttribute("data-pane") !== name);
      });
    });
  });
  // default mobile: systems visible, waiting hidden
  if (window.matchMedia("(max-width: 920px)").matches) {
    document.querySelector('.panel[data-pane="waiting"]').classList.add("off");
  }

  $("btn-focus").addEventListener("click", function () {
    document.body.classList.toggle("focus");
    say(document.body.classList.contains("focus")
      ? "Focus mode on. Panels dimmed — noise down."
      : "Focus mode off. Panels back.");
  });
  $("btn-voice").addEventListener("click", function () {
    var on = this.getAttribute("aria-pressed") !== "true";
    this.setAttribute("aria-pressed", String(on));
    this.classList.toggle("on", on);
    this.textContent = "Voice: " + (on ? "on" : "off");
  });

  function handleAsk(q) {
    q = (q || "").trim(); if (!q) return;
    var low = q.toLowerCase();
    if (low.indexOf("morning") >= 0 || low.indexOf("brief") >= 0)
      say("Morning plate is in Jarvis chat weekdays ~8am ET. League Week 2 live; Buffer queue full; Maker inbox still pending.");
    else if (low.indexOf("status") >= 0)
      say("Systems online. Green majority. Scout paused on purpose. Talk for real actions still goes through Jarvis in Grok Bot.");
    else if (low.indexOf("reading") >= 0 || low.indexOf("read") >= 0)
      say("Reading owner overview + League Week 2 + Buffer refill. Live CoS feed not wired into the HUD yet.");
    else if (low.indexOf("focus") >= 0) {
      document.body.classList.add("focus"); say("Focus mode on.");
    } else
      say("Heard. Jarvis talk bridge comes next — until then use Jarvis · Chief of Staff in Grok Bot.");
  }
  $("btn-ask").addEventListener("click", function () { handleAsk($("ask").value); $("ask").value = ""; });
  $("ask").addEventListener("keydown", function (e) { if (e.key === "Enter") { handleAsk(this.value); this.value = ""; } });
  document.querySelectorAll(".pills [data-q]").forEach(function (b) {
    b.addEventListener("click", function () { handleAsk(b.getAttribute("data-q")); });
  });

  renderSys(); renderWait();
  fetch("/api/owner/overview", { credentials: "same-origin" }).then(function (r) {
    if (!r.ok) throw new Error("auth");
    return r.json();
  }).then(function (d) {
    $("gate").classList.add("hidden");
    say("Systems online. Good evening, Donald.");
    var live = (d.listingsLive || 0) + " live · " + (d.pendingCount || 0) + " in review · " + (d.supportOpen || 0) + " support open";
    renderSys([{ name: "Marketplace", status: d.pendingCount ? "warn" : "ok", detail: live }]);
  }).catch(function () {
    $("gate").classList.remove("hidden");
    say("Owner session missing.");
  });
})();
</script>
</body>
</html>
