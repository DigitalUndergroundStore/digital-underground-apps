<!DOCTYPE html>
<html lang="en">
<head>

<body class="dt">
<div class="wrap">
  <div class="site-top">
    <a class="brand" href="/store/"><span class="du-logo"><img class="du-logo-full" src="/assets/logo/du-horizontal.svg" alt="Digital Underground" width="200" height="36"><img class="du-logo-icon" src="/assets/logo/du-mark-anim-icon.svg" alt="Digital Underground" width="36" height="36"></span></a>
    <nav aria-label="Site">
      <a href="/store/">Store</a>
      <a href="/">Developer Marketplace</a>
      <a href="/community/dashboard/" class="login-btn">Creator dashboard</a>
      <span class="cta-wrap"><a class="cta" href="/community/submit/">List your project</a></span>
    </nav>
  </div>
  <nav class="crumb" aria-label="Breadcrumb"><a href="/">Developer Marketplace</a><span aria-hidden="true">›</span><span id="crumb-name">Listing</span></nav>
  <main id="out" aria-busy="true">
    <div class="dt-head"><div class="skel" style="width:72px;height:72px;flex:none"></div><div style="flex:1"><div class="skel" style="height:26px;width:70%"></div><div class="skel" style="height:15px;width:40%;margin-top:10px"></div></div></div>
    <div class="skel" style="height:48px;margin-top:18px"></div>

  </main>

</div>
<div class="sticky-cta" id="sticky" aria-hidden="true"></div>
<script>
(function () {
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  var EXT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';
  var SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="m16 6-4-4-4 4"/><path d="M12 2v14"/></svg>';
  var CATS = { apps: "App", "ai-tools": "AI tool", games: "Game", books: "Book", templates: "Template", other: "Other" };
  var id = new URLSearchParams(location.search).get("id") || "";
  var out = document.getElementById("out");
  function paras(t) { return String(t || "").split(/\n{2,}/).map(function (p) { return "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>"; }).join(""); }
  function media(l) {
    var v = l.video, poster = l.imageUrl || (v && v.poster) || "";
    /* Third-party video loads only after a click (no YouTube/Vimeo requests or cookies before that). */
    if (v && (v.kind === "youtube" || v.kind === "vimeo")) {
      var src, host;
      if (v.kind === "youtube") { var id = (/embed\/([\w-]{11})/.exec(v.src) || [])[1]; src = v.src.replace("://www.youtube.com/", "://www.youtube-nocookie.com/").replace("://youtube.com/", "://www.youtube-nocookie.com/") + "&autoplay=1&playsinline=1&controls=1"; host = "YouTube"; }
      else { src = v.src + "&autoplay=1&playsinline=1&dnt=1"; host = "Vimeo"; }
      return '<div class="media media-ext" data-src="' + esc(src) + '" data-title="' + esc(l.name) + ' video" data-allow="autoplay; encrypted-media; picture-in-picture; fullscreen"' + (poster ? ' style="background-image:url(\'' + esc(poster) + '\')"' : "") + '><button type="button" class="media-play"><span aria-hidden="true">▶</span> Play video <small>(loads from ' + host + ')</small></button></div>';
    }
    if (v && v.kind === "file") return '<div class="media"><video autoplay muted loop playsinline controls preload="auto"' + (poster ? ' poster="' + esc(poster) + '"' : "") + ' aria-label="' + esc(l.name) + ' video"><source src="' + esc(v.src) + (poster ? "" : "#t=0.1") + '" type="' + esc(v.type) + '"></video></div>';
    if (!l.imageUrl) return "";
    return '<div class="media"><img class="bg" src="' + esc(l.imageUrl) + '" alt="" aria-hidden="true"><img class="fg" src="' + esc(l.imageUrl) + '" alt="' + esc(l.name) + ' preview"></div>';
  }
  fetch("/api/community/listing?id=" + encodeURIComponent(id)).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (d) {
    out.removeAttribute("aria-busy");
    if (!d || !d.listing) { out.innerHTML = '<div class="notfound"><h1>This listing isn\'t available</h1><p>It may have been unpublished or is still in review.</p><a class="btn2 primary" style="flex:none" href="/">Browse the marketplace</a></div>'; return; }
    var l = d.listing, href = esc(l.visitUrl || l.projectUrl), price = esc(l.priceLabel || "See site");
    document.title = l.name + " — Developer Marketplace — Digital Underground";
    document.getElementById("crumb-name").textContent = l.name;
    var host = ""; try { host = new URL(l.projectUrl).hostname.replace(/^www\./, ""); } catch (_) {}
    var x = l.xHandle ? ' · <a href="https://x.com/' + esc(l.xHandle) + '" target="_blank" rel="noopener">@' + esc(l.xHandle) + "</a>" : "";
    var ms = l.makerSlug && /^[a-z0-9-]{1,48}$/.test(l.makerSlug) ? l.makerSlug : /^cm_kerzy_/.test(l.id || "") ? "kerzy-labs" : /^wolfitway$/i.test(l.makerName || "") ? "wolfitway" : "";
    var mk = ms ? '<a href="/makers/' + ms + '/">' + esc(l.makerName) + "</a>" : esc(l.makerName);
    var tags = (l.tags || []).map(function (t) { return '<span class="chip2">#' + esc(t) + "</span>"; }).join("");
    out.innerHTML =
      '<div class="dt-grid"><div>' +
        '<header class="dt-head">' + (l.video || l.imageUrl ? "" : '<span class="dt-logo dt-ph" aria-hidden="true">' + esc((l.name || "?").charAt(0).toUpperCase()) + "</span>") + '<div style="min-width:0"><h1>' + esc(l.name) + '</h1><p class="dt-maker">by ' + mk + x + "</p></div></header>" +
        (l.contactable ? '<button type="button" class="btn2" id="contact-btn" aria-expanded="false" aria-controls="contact-panel" style="flex:none;margin:10px 0 2px;border:1px solid rgba(34,211,238,.55);color:#a5f3fc">&#9993;&nbsp; Contact the developer</button>' : "") +
        (l.curated ? '<p style="margin:8px 0 0">' + '<span class="pick-badge" style="display:inline-block;margin:4px 6px 2px 0;padding:2px 9px;border-radius:999px;background:linear-gradient(90deg,#a855f7,#00f2fe);color:#05070d;font:800 11px/1.5 ui-sans-serif,system-ui,sans-serif;letter-spacing:.03em;width:max-content">&#9733; Featured pick</span>' + '<span class="pick-note" style="display:block;margin:2px 0 4px;color:#94a3b8;font:500 11.5px/1.4 ui-sans-serif,system-ui,sans-serif">Curated by Digital Underground</span>' + (l.makerUrl ? '<a href="' + esc(l.makerUrl) + '" target="_blank" rel="noopener" style="font-size:13px">Official site: ' + esc(l.makerUrl.replace(/^https?:\/\//, '')) + ' &#8599;</a>' : '') + '</p>' : (l.makerUrl ? '<p style="margin:6px 0 0"><a href="' + esc(l.makerUrl) + '" target="_blank" rel="noopener" style="font-size:13px">Maker site: ' + esc(l.makerUrl.replace(/^https?:\/\//, '')) + ' &#8599;</a></p>' : "")) +
        (l.statusLabel ? '<p style="margin:6px 0 0"><span class="label-badge" style="display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid rgba(34,211,238,.5);background:rgba(34,211,238,.12);color:#a5f3fc;font:700 11px/1.5 ui-sans-serif,system-ui,sans-serif;letter-spacing:.02em;width:max-content;max-width:100%;overflow-wrap:anywhere">' + esc(String(l.statusLabel).slice(0, 24)) + "</span></p>" : "") +
        (l.stage && l.stage !== 'Released' ? '<p style="margin:6px 0 0"><span class="stage-badge" style="display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid rgba(251,191,36,.55);background:rgba(251,191,36,.12);color:#fcd34d;font:700 11px/1.5 ui-sans-serif,system-ui,sans-serif;letter-spacing:.02em;width:max-content">' + esc(l.stage) + "</span></p>" : "") +
        '<p class="dt-pitch">' + esc(l.pitchShort) + "</p>" +
        '<div class="chips2"><span class="chip2 price">' + price + "</span>" + (l.category ? '<span class="chip2 cat">' + esc(CATS[l.category] || l.category) + "</span>" : "") + tags + "</div>" +
        '<div class="dt-cta" id="cta"><a class="btn2 primary" data-out="' + esc(l.id) + '" href="' + href + '" target="_blank" rel="noopener">Visit website' + EXT + '</a><button type="button" class="btn2" id="share" aria-label="Share this listing">' + SHARE + "</button>" + "</div>" +
        (l.contactable ? '<section class="panel" id="contact-panel" hidden><h2>Contact the developer</h2><p class="muted small" style="margin:0 0 10px">Your message goes privately to ' + esc(l.makerName) + '. They can reply to your email.</p><form id="contact-form" novalidate style="display:grid;gap:10px">' +
          '<label class="small">Name<input name="name" required maxlength="100" autocomplete="name" style="display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:inherit;font:inherit"></label>' +
          '<label class="small">Email<input name="email" type="email" required maxlength="200" autocomplete="email" style="display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:inherit;font:inherit"></label>' +
          '<label class="small">Message<textarea name="message" required minlength="10" maxlength="5000" rows="5" style="display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:inherit;font:inherit"></textarea></label>' +
          '<div style="position:absolute;left:-9999px" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>' +
          '<button type="submit" class="btn2 primary" style="flex:none">Send message</button><p id="contact-msg" class="small" role="status" style="margin:0"></p></form></section>' : "") +
        media(l) +
        '<section class="panel"><h2>About</h2><div class="prose">' + paras(l.descriptionLong || l.pitchShort) + "</div></section>" +
      '</div><aside class="side">' +
        '<section class="panel"><h2>Details</h2><dl class="facts">' +
          "<div><dt>Price</dt><dd>" + price + "</dd></div>" +
          (l.category ? "<div><dt>Category</dt><dd>" + esc(CATS[l.category] || l.category) + "</dd></div>" : "") +
          "<div><dt>Maker</dt><dd>" + mk + (ms ? ' · <a href="/makers/' + ms + '/">See all by this maker</a>' : "") + "</dd></div>" +
          (host ? "<div><dt>Website</dt><dd>" + esc(host) + "</dd></div>" : "") +
        '</dl><a class="btn2 primary" style="width:100%;margin-top:14px" data-out="' + esc(l.id) + '" href="' + href + '" target="_blank" rel="noopener">Visit site' + EXT + "</a></section>" +
        '<p class="muted small" style="margin:12px 4px 0">Listed free on the Digital Underground Developer Marketplace. Purchases happen on the maker\'s site.</p>' +
        '<p style="margin:10px 4px 0"><button type="button" id="report-btn" aria-expanded="false" aria-controls="report-panel" style="background:none;border:0;padding:4px 0;color:#94a3b8;font:500 12px/1.4 ui-sans-serif,system-ui,sans-serif;text-decoration:underline;cursor:pointer">&#9873; Report</button></p>' +
        '<section class="panel" id="report-panel" hidden style="margin-top:8px"><h2>Report this listing</h2><form id="report-form" novalidate style="display:grid;gap:10px">' +
          '<label class="small">Reason<select name="reason" required style="display:block;width:100%;margin-top:4px;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:inherit;font:inherit"><option value="">Choose a reason</option><option>Spam or scam</option><option>Broken link</option><option>Misleading</option><option>Inappropriate</option><option>Other</option></select></label>' +
          '<label class="small">Note (optional)<textarea name="note" maxlength="500" rows="3" style="display:block;width:100%;margin-top:4px;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:inherit;font:inherit"></textarea></label>' +
          '<div style="position:absolute;left:-9999px" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>' +
          '<button type="submit" class="btn2" style="flex:none">Send report</button><p id="report-msg" class="small" role="status" style="margin:0"></p></form></section>' +
      "</aside></div>";
    var st = document.getElementById("sticky");
    st.innerHTML = '<div class="s-meta"><b>' + esc(l.name) + "</b><span>" + price + '</span></div><a class="btn2 primary" data-out="' + esc(l.id) + '" href="' + href + '" target="_blank" rel="noopener" tabindex="-1">Visit' + EXT + "</a>";
    var cta = document.getElementById("cta");
    if ("IntersectionObserver" in window) new IntersectionObserver(function (e) { var show = !e[0].isIntersecting && e[0].boundingClientRect.top < 0; st.classList.toggle("show", show); st.setAttribute("aria-hidden", String(!show)); }).observe(cta);
    document.getElementById("share").addEventListener("click", function () {
      var u = location.origin + "/community/p/?id=" + encodeURIComponent(l.id);
      if (navigator.share) { navigator.share({ title: l.name, text: l.pitchShort, url: u }).catch(function () {}); return; }
      (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { var t = document.createElement("div"); t.className = "toast2"; t.setAttribute("role", "status"); t.textContent = "Link copied"; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200); }).catch(function () {});
    });
    document.querySelectorAll("img.dt-logo, .media img").forEach(function (im) { im.onerror = function () { im.onerror = null; im.src = "/community/og-dm-v3.jpg"; }; });
    var cb = document.getElementById("contact-btn");
    if (cb) {
      var cp = document.getElementById("contact-panel"), cf = document.getElementById("contact-form"), cm = document.getElementById("contact-msg");
      cb.addEventListener("click", function () { cp.hidden = !cp.hidden; cb.setAttribute("aria-expanded", String(!cp.hidden)); if (!cp.hidden) { cp.scrollIntoView({ behavior: "smooth", block: "start" }); cf.name.focus({ preventScroll: true }); } });
      cf.addEventListener("submit", function (e) {
        e.preventDefault();
        var btn = cf.querySelector("button[type=submit]");
        if (!cf.name.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(cf.email.value.trim()) || cf.message.value.trim().length < 10) { cm.textContent = "Please add your name, a valid email and a message (10+ characters)."; return; }
        btn.disabled = true; cm.textContent = "Sending…";
        fetch("/api/community/contact", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: l.id, name: cf.name.value, email: cf.email.value, message: cf.message.value, website: cf.website.value }) })
          .then(function (r) { return r.json().catch(function () { return {}; }); })
          .then(function (d) { if (d && d.ok) { cf.reset(); cm.textContent = "Message sent. The developer will reply to your email."; } else { cm.textContent = (d && d.error) || "Couldn't send right now. Please try again."; } })
          .catch(function () { cm.textContent = "Couldn't send right now. Please try again."; })
          .then(function () { btn.disabled = false; });
      });
      if (location.hash === "#contact") setTimeout(function () { cb.click(); }, 50);
    }
    var rb = document.getElementById("report-btn");
    if (rb) {
      var rp = document.getElementById("report-panel"), rf = document.getElementById("report-form"), rm = document.getElementById("report-msg");
      rb.addEventListener("click", function () { rp.hidden = !rp.hidden; rb.setAttribute("aria-expanded", String(!rp.hidden)); if (!rp.hidden) rf.reason.focus(); });
      rf.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!rf.reason.value) { rm.textContent = "Please choose a reason."; return; }
        var btn = rf.querySelector("button[type=submit]"); btn.disabled = true; rm.textContent = "Sending…";
        fetch("/api/community/report", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: l.id, reason: rf.reason.value, note: rf.note.value, website: rf.website.value }) })
          .then(function (r) { return r.json().catch(function () { return {}; }); })
          .then(function (d) { if (d && d.ok) { rf.reset(); rm.textContent = "Thanks. We'll take a look."; } else { rm.textContent = (d && d.error) || "Couldn't send right now. Please try again."; btn.disabled = false; } })
          .catch(function () { rm.textContent = "Couldn't send right now. Please try again."; btn.disabled = false; });
      });
    }
    if (window.duTrack) duTrack.view(l.id);
  });
})();
</script>
<script>
document.addEventListener("click", function (e) {
  var b = e.target.closest && e.target.closest(".media-ext .media-play"); if (!b) return;
  var m = b.parentNode, f = document.createElement("iframe");
  f.src = m.getAttribute("data-src"); f.title = m.getAttribute("data-title"); f.allow = m.getAttribute("data-allow");
  f.setAttribute("allowfullscreen", ""); f.referrerPolicy = "strict-origin-when-cross-origin";
  m.style.backgroundImage = ""; m.innerHTML = ""; m.appendChild(f); f.focus();
});
</script>
<style>.media-ext{position:relative;aspect-ratio:16/9;background:var(--du-surface-2,#120e22) center/cover no-repeat;display:grid;place-items:center;border-radius:var(--du-r-lg,20px);overflow:hidden}.media-play{min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid var(--du-border-strong,rgba(191,232,255,.55));background:rgba(6,4,17,.85);color:#fff;font:700 16px/1.2 var(--du-font-body,system-ui);cursor:pointer}.media-play small{font-weight:600;color:var(--du-muted,#c8c0da)}.media-play:focus-visible{outline:2px solid var(--du-accent,#bfe8ff);outline-offset:3px}</style>
</body>
</html>
