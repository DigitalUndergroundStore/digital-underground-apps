<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#120e0c" />
<meta name="robots" content="noindex" />
<title>Session Notes — Session Forge</title>
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Session Forge" />
<style>html,body{margin:0;background:#120e0c;color:#f3e6d4;font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#du-gate{max-width:440px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 40px}
.du-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(145deg,#ff9a4d,#8b3a1a 60%,#3d2010);box-shadow:0 0 28px rgba(255,138,61,.35);margin-bottom:14px}
h1{font-size:1.5rem;margin:0 0 4px}p{color:#b5a28c;margin:0 0 14px}
#du-form{display:none}#du-form.on{display:block}
label{display:block;font-size:.9rem;color:#b5a28c;margin:0 0 6px}
input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;letter-spacing:.06em;padding:13px 14px;border-radius:12px;border:1px solid #3d3228;background:#1c1612;color:#f3e6d4;text-transform:uppercase}
input:focus{outline:2px solid #ff8a3d;outline-offset:1px}
button{width:100%;min-height:50px;margin-top:12px;font:inherit;font-weight:650;color:#fff;border:0;border-radius:999px;background:linear-gradient(135deg,#d96a2b,#a84318);cursor:pointer}
button:disabled{opacity:.6}
#du-msg{min-height:1.5em;margin-top:12px;color:#e8c46a}#du-msg.bad{color:#f0a0a0}
.du-help{font-size:.9rem;border-top:1px solid #3d3228;margin-top:22px;padding-top:14px}
.du-help a{color:#e8c46a}</style>
</head>
<body>
<main id="du-gate">
  <div class="du-logo" aria-hidden="true"></div>
  <h1>Session Forge</h1>
  <p id="du-status">Opening…</p>
  <form id="du-form" autocomplete="off">
    <label for="du-code">Buyer code</label>
    <input id="du-code" name="code" placeholder="SF-XXXX-XXXX-XXXX" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text" />
    <button id="du-go" type="submit">Unlock</button>
    <div id="du-msg" role="status" aria-live="polite"></div>
    <div class="du-help">
      <p>Your buyer code is in <strong>ON YOUR PHONE - START HERE.pdf</strong>, which came with your Session Forge purchase on Gumroad or Payhip. Tapping the link in that PDF unlocks it automatically. You only need to do this once on each device.</p>
      <p>Don't have Session Forge yet? <a href="https://kerzy.gumroad.com/l/wcvgxo">Gumroad</a> · <a href="https://payhip.com/b/dnbT3">Payhip</a></p>
    </div>
  </form>
  <noscript><p>Session Forge needs JavaScript turned on.</p></noscript>
</main>
<script src="../unlock.js?v=202610060724-bf6674bc" data-page="app/notes.html" data-root="../"></script>
</body>
</html>
