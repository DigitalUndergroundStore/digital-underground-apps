<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face {
  font-family: InterVar;
  src: url("file:///usr/share/fonts/truetype/sand-box/google/Inter/Inter-VariableFont_opsz,wght.ttf") format("truetype");
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
}
@font-face {
  font-family: OutfitVar;
  src: url("file:///usr/share/fonts/truetype/sand-box/google/Outfit/Outfit-VariableFont_wght.ttf") format("truetype");
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-family: InterVar, Inter, system-ui, sans-serif;
  color: #fff;
}
.logo { display: block; height: auto; }


body { display: flex; align-items: center; justify-content: center; }
.card {
  width: 1200px;
  height: 630px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 36px 56px 32px;
}
.glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.card > .stack { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; width: 100%; }
.logo { width: 400px; margin: 0 auto 18px; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.35)); }
.title {
  font-family: OutfitVar, Outfit, InterVar, sans-serif;
  font-weight: 800;
  font-size: 132px;
  line-height: 0.88;
  letter-spacing: -0.055em;
  color: #fff;
}
.tag {
  margin-top: 14px;
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.02em;
}
.price-block { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.big-price {
  font-family: OutfitVar, Outfit, InterVar, sans-serif;
  font-weight: 800;
  font-size: 68px;
  letter-spacing: -0.045em;
  color: #fff;
  line-height: 1;
}
.save {
  display: inline-flex;
  align-items: center;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 7px 14px;
  border-radius: 999px;
  line-height: 1;
}
.features {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin-top: 30px;
  width: 100%;
  max-width: 1000px;
}
.feat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.ico {
  width: 72px;
  height: 72px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ico svg { width: 32px; height: 32px; display: block; }
.feat span {
  font-size: 28px;
  font-weight: 650;
  letter-spacing: -0.03em;
  line-height: 1.15;
  white-space: nowrap;
  color: #f3f4f8;
}

body { background: #080810; }
.card {
  background: #080810;
}
.glow {
  background:
    radial-gradient(920px 520px at 50% 118%, rgba(104, 72, 230, 0.48), transparent 58%),
    radial-gradient(640px 380px at 50% -8%, rgba(78, 96, 220, 0.22), transparent 56%),
    radial-gradient(420px 260px at 50% 38%, rgba(120, 110, 255, 0.14), transparent 70%);
}
.title { text-shadow: 0 0 90px rgba(130, 120, 255, 0.28), 0 2px 0 rgba(0,0,0,0.15); }
.tag { color: #c5c9d4; }
.ico.star { background: linear-gradient(180deg, #6a93ff 0%, #3f72f2 100%); color: #fff; box-shadow: 0 10px 24px rgba(63, 114, 242, 0.38), inset 0 1px 0 rgba(255,255,255,0.28); }
.ico.x    { background: linear-gradient(180deg, #7a73f6 0%, #564fe0 100%); color: #fff; box-shadow: 0 10px 24px rgba(86, 79, 224, 0.40), inset 0 1px 0 rgba(255,255,255,0.28); }
.ico.mega { background: linear-gradient(180deg, #f08b4d 0%, #d96a2e 100%); color: #fff; box-shadow: 0 10px 24px rgba(217, 106, 46, 0.38), inset 0 1px 0 rgba(255,255,255,0.28); }
.save {
  color: #ece8ff;
  background: rgba(110, 96, 230, 0.28);
  border: 1px solid rgba(170, 160, 255, 0.38);
  box-shadow: 0 0 20px rgba(110, 96, 230, 0.18);
}
</style></head><body>
<div class="card">
  <div class="glow"></div>
  <div class="stack">
    <img class="logo" src="du-horizontal.png" alt="Digital Underground">
    <div class="title">MAKER PRO</div>
    <div class="tag">Get seen. Get promoted.</div>
    <div class="price-block">
      <div class="big-price">$9/mo · $79/yr</div>
      <div class="save">Save 27%</div>
    </div>
    <div class="features">
      <div class="feat"><div class="ico star"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.15l2.86 5.95 6.54.9-4.76 4.55 1.2 6.5L12 16.92 6.16 20.05l1.2-6.5-4.76-4.55 6.54-.9L12 2.15z"/></svg></div><span>Featured slots</span></div>
      <div class="feat"><div class="ico x"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.85 3.4h2.98L12.7 8.95 18.4 20.6h-3.24l-3.48-6.86-3.98 6.86H4.48l4.9-6.52L3.9 3.4h3.3l3.16 6.3 3.49-6.3zm-.7 15.3h1.5L9.18 5.22H7.58l5.57 13.48z"/></svg></div><span>DU X channels</span></div>
      <div class="feat"><div class="ico mega"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.25 5.05c2.35-1.28 5.15-1.42 7.85.08v13.74c-2.7 1.5-5.5 1.18-7.85-.1V5.05z"/><path d="M12.35 6.2L6.55 9.85H4.4c-.77 0-1.4.63-1.4 1.4v2.5c0 .77.63 1.4 1.4 1.4h2.15l5.8 3.65V6.2z"/><path d="M7.15 15.2v2.05a3.05 3.05 0 0 0 2.55 3.01l.15-1.54A1.55 1.55 0 0 1 8.6 17.2V15.2H7.15z"/></svg></div><span>Promotion from DU</span></div>
    </div>
  </div>
</div>
</body></html>
