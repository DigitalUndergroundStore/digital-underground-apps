<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face {
  font-family: InterVar;
  src: url("file:///usr/share/fonts/truetype/sand-box/google/Inter/Inter-VariableFont_opsz,wght.ttf") format("truetype");
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
}
@font-face {
  font-family: OutfitVar;
  src: url("file:///usr/share/fonts/truetype/sand-box/google/Outfit/Outfit-VariableFont_wght.ttf") format("truetype");
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: #0b0d14;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-family: InterVar, Inter, system-ui, sans-serif;
}
.logo { display: block; height: auto; }


body {
  background: #0a0b12;
}
.frame {
  width: 1200px; height: 630px;
  padding: 0;
}
.card {
  width: 1200px; height: 630px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(900px 600px at 110% 10%, rgba(124, 92, 255, 0.38), transparent 58%),
    radial-gradient(800px 500px at -10% 110%, rgba(40, 180, 200, 0.16), transparent 50%),
    linear-gradient(115deg, #0c0d16 0%, #15122a 48%, #1a1540 78%, #2a1d62 100%);
  padding: 48px 56px 44px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
}
.logo { width: 280px; }
.prices { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.price {
  font-family: OutfitVar, Outfit, InterVar, sans-serif;
  font-weight: 750;
  font-size: 28px;
  letter-spacing: -0.03em;
  color: #fff;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
  padding: 10px 16px;
  border-radius: 999px;
  line-height: 1;
}
.founding {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #7ef0dc;
  font-weight: 650;
  font-size: 22px;
  letter-spacing: -0.01em;
  padding: 9px 14px 9px 12px;
  border-radius: 999px;
  border: 1px solid rgba(94, 234, 212, 0.38);
  background: rgba(16, 36, 44, 0.45);
  line-height: 1;
}
.founding svg { width: 15px; height: 15px; color: #7ef0dc; }
.mid { margin-top: 8px; }
.title {
  font-family: OutfitVar, Outfit, InterVar, sans-serif;
  font-weight: 800;
  font-size: 120px;
  line-height: 0.9;
  letter-spacing: -0.05em;
  color: #fff;
}
.tag {
  margin-top: 16px;
  font-size: 32px;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: #d0d3dc;
}
.pills { display: flex; gap: 12px; flex-wrap: nowrap; align-items: center; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 999px;
  padding: 12px 18px 12px 12px;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: #f3f4f8;
  line-height: 1;
  white-space: nowrap;
}
.dot {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 36px;
}
.dot svg { width: 16px; height: 16px; }
.dot.star { background: #4f7df5; color: #fff; }
.dot.x { background: #5b54e8; color: #fff; }
.dot.mega { background: #e07a3a; color: #fff; }
</style></head><body>
<div class="frame"><div class="card">
  <div class="top">
    <img class="logo" src="du-horizontal.png" alt="Digital Underground">
    <div class="prices">
      <div class="price">$9/mo · $79/yr</div>
      <div class="founding"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.62 5.7 6.26.86-4.55 4.36 1.14 6.22L12 16.86 6.53 19.74l1.14-6.22L3.12 9.16l6.26-.86L12 2.6z"/></svg>Founding 25: $59/yr</div>
    </div>
  </div>
  <div class="mid">
    <div class="title">MAKER PRO</div>
    <div class="tag">Get seen. Get promoted.</div>
  </div>
  <div class="pills">
    <div class="pill"><div class="dot star"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.62 5.7 6.26.86-4.55 4.36 1.14 6.22L12 16.86 6.53 19.74l1.14-6.22L3.12 9.16l6.26-.86L12 2.6z"/></svg></div>Featured slots</div>
    <div class="pill"><div class="dot x"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.55 3.2h3.28l-5.67 6.48L18.9 20.8h-4.22l-3.7-7.28-4.22 7.28H2.5l6.08-6.95L2.35 3.2h4.3l3.36 6.68L14.55 3.2zm-1.15 15.9h1.82L8.55 4.95H6.6l6.8 14.15z"/></svg></div>DU X channels</div>
    <div class="pill"><div class="dot mega"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4.6 10.2v3.6c0 .5.4.9.9.9h1.7l4.4 3.5V6.8L7.2 10.2H5.5c-.5 0-.9.4-.9 1z"/><path d="M11.6 7.2c2.2-1.1 4.7-1.1 7.2.2v9.2c-2.5 1.3-5 .9-7.2-.2"/><path d="M7.4 15.8v1.6c0 1.4 1 2.6 2.4 2.8"/></svg></div>Promotion from DU</div>
  </div>
</div></div>
</body></html>
