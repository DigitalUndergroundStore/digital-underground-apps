<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pantry Week promo</title>
<style>
@font-face {
  font-family: "Fraunces";
  src: url("../fonts/Fraunces.ttf") format("truetype");
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
}
:root {
  --paper: #f6f1e7;
  --ink: #241c14;
  --sage: #3e6b2c;
  --safe: 270px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }
body {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  font-family: Inter, "Noto Sans", sans-serif;
  color: var(--ink);
}
html.square body { height: 1080px; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
html.square #stage { height: 1080px; }

.poster {
  position: absolute;
  left: 72px;
  right: 72px;
  top: var(--safe);
  bottom: var(--safe);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  opacity: 0;
}
html.square .poster { left: 48px; right: 48px; }
.eyebrow {
  margin: 0 0 16px;
  font-size: 26px;
  font-weight: 750;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--sage);
}
.display {
  margin: 0;
  font-family: Fraunces, "Liberation Serif", Georgia, serif;
  font-weight: 650;
  font-variation-settings: "opsz" 144, "wght" 650, "SOFT" 40, "WONK" 0;
  font-size: 124px;
  line-height: 0.92;
  letter-spacing: -0.035em;
}
.again {
  margin: 22px 0 0;
  font-family: Fraunces, Georgia, serif;
  font-weight: 560;
  font-size: 68px;
  color: var(--sage);
}
.price {
  margin: 18px 0 0;
  font-family: Fraunces, Georgia, serif;
  font-weight: 700;
  font-size: 120px;
  letter-spacing: -0.04em;
  color: var(--sage);
  line-height: 0.95;
}
.pay { margin: 6px 0 0; font-size: 46px; font-weight: 800; }
.url { margin: 18px 0 0; font-size: 32px; font-weight: 750; }
.fine { margin: 10px 0 0; font-size: 26px; font-weight: 650; color: #3f342b; }

.cap {
  position: absolute;
  top: 278px;
  left: 0;
  right: 0;
  z-index: 6;
  display: flex;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
}
.cap span {
  background: var(--sage);
  color: #fff;
  font-size: 42px;
  font-weight: 750;
  letter-spacing: -0.02em;
  line-height: 1;
  padding: 16px 28px 18px;
  border-radius: 999px;
}

.rig {
  position: absolute;
  left: 0;
  right: 0;
  top: 390px;
  display: flex;
  justify-content: center;
  opacity: 0;
}
.device {
  position: relative;
  background: linear-gradient(165deg, #4a4a4e 0%, #1a1a1c 42%, #0c0c0e 100%);
  box-shadow:
    0 28px 70px rgba(36, 28, 20, 0.28),
    inset 0 0 0 2px rgba(255, 255, 255, 0.16);
}
.phone {
  width: 630px;
  height: 1248px;
  border-radius: 58px;
  padding: 14px 13px 16px;
}
.phone:before, .phone:after {
  content: "";
  position: absolute;
  width: 4px;
  border-radius: 3px;
  background: #2c2c2e;
}
.phone:before { left: -3px; top: 168px; height: 54px; }
.phone:after { right: -3px; top: 210px; height: 92px; }
.tablet {
  width: 980px;
  height: 1180px;
  border-radius: 36px;
  padding: 16px 16px 18px;
}
.speaker {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  height: 7px;
  border-radius: 8px;
  background: #070708;
  z-index: 2;
}
.phone .speaker { width: 96px; }
.tablet .speaker { width: 10px; height: 10px; border-radius: 50%; top: 8px; }
.screen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #2a2218;
  border-radius: 44px;
}
.tablet .screen { border-radius: 22px; background: #f7f1e6; }
.shot {
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;
}
.shot img { width: 100%; height: 100%; display: block; }
.finger {
  position: absolute;
  width: 96px;
  height: 96px;
  margin: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.42);
  border: 5px solid #fff;
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35);
  opacity: 0;
  z-index: 3;
}
.finger:after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 22px;
  height: 22px;
  margin: -11px 0 0 -11px;
  border-radius: 50%;
  background: #fff;
}
.tablet .finger {
  background: rgba(62, 107, 44, 0.3);
  border-color: #3e6b2c;
}
.tablet .finger:after { background: #3e6b2c; }

html.square .display { font-size: 78px; }
html.square .again { font-size: 46px; margin-top: 10px; }
html.square .eyebrow { font-size: 18px; margin-bottom: 8px; }
html.square .price { font-size: 72px; }
html.square .pay { font-size: 32px; }
html.square .url { font-size: 22px; }
html.square .fine { font-size: 18px; }
html.square .cap { top: 258px; }
html.square .cap span { font-size: 30px; padding: 10px 18px 12px; }
html.square .rig { top: 328px; }
html.square .phone { width: 640px; height: 730px; border-radius: 46px; }
html.square .tablet { width: 1000px; height: 760px; }
html.square .finger { width: 72px; height: 72px; }
#preload { position: absolute; width: 0; height: 0; overflow: hidden; }
</style>
</head>
<body>
<div id="stage">
  <div class="poster" id="hook">
    <p class="eyebrow">Every night</p>
    <h1 class="display">What's for<br>dinner?</h1>
    <p class="again">Again?</p>
  </div>
  <div class="poster" id="cta">
    <p class="eyebrow">Offline meal planner</p>
    <h1 class="display">Pantry Week</h1>
    <p class="price">CAD$24</p>
    <p class="pay">Pay once.</p>
    <p class="url">digitalundergroundstore.com</p>
    <p class="fine">No subscription. No account.</p>
  </div>
  <div class="cap" id="cap"><span id="capText">Pick the meals</span></div>
  <div class="rig" id="rig">
    <div class="device phone" id="phone">
      <div class="speaker"></div>
      <div class="screen" id="screen">
        <div class="shot" id="shot">
          <img id="shotImg" alt="" />
          <div class="finger" id="finger"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="preload">
    <img src="../footage/phone-recipes.png" alt="" />
    <img src="../footage/phone-picker.png" alt="" />
    <img src="../footage/phone-plan-two.png" alt="" />
    <img src="../footage/phone-plan-fill-btn.png" alt="" />
    <img src="../footage/phone-week-full.png" alt="" />
    <img src="../footage/phone-shop.png" alt="" />
    <img src="../footage/phone-shop-have.png" alt="" />
    <img src="../footage/tablet-print.png" alt="" />
    <img src="../footage/tablet-week.png" alt="" />
  </div>
</div>
<script>
(function () {
  var phoneShots = {
    "phone-recipes": [390, 844],
    "phone-picker": [390, 844],
    "phone-plan-two": [390, 844],
    "phone-plan-fill-btn": [390, 844],
    "phone-week-full": [390, 844],
    "phone-shop": [390, 844],
    "phone-shop-have": [390, 844]
  };
  var tabletShots = {
    "tablet-print": [1100, 1400],
    "tablet-week": [1100, 1400]
  };

  function clamp(x) { return Math.max(0, Math.min(1, x)); }
  function fade(t, a, b, fadeIn, fadeOut) {
    if (t < a || t > b) return 0;
    var o = 1;
    if (fadeIn && t < a + 0.16) o = (t - a) / 0.16;
    if (fadeOut && t > b - 0.16) o = Math.min(o, (b - t) / 0.16);
    return clamp(o);
  }
  function lerp(a, b, p) { return a + (b - a) * p; }

  var beats = [
    { a: 1.58, b: 3.15, shot: "phone-recipes", fx: 0.5, fy: 0.4, z: 1.28, z2: 1.36, cap: "Pick the meals",
      tap: { t: 2.35, x: 0.28, y: 0.585 } },
    { a: 3.15, b: 4.7, shot: "phone-picker", fx: 0.5, fy: 0.46, z: 1.18, z2: 1.26, cap: "Pick the meals",
      tap: { t: 4.05, x: 0.5, y: 0.443 } },
    { a: 4.7, b: 6.15, shot: "phone-plan-two", fx: 0.5, fy: 0.55, z: 1.22, z2: 1.3, cap: "Pick the meals" },
    { a: 6.15, b: 7.55, shot: "phone-plan-fill-btn", fx: 0.32, fy: 0.5, z: 1.2, z2: 1.26, cap: "The week fills in",
      tap: { t: 6.7, x: 0.26, y: 0.5 } },
    { a: 7.55, b: 10.7, shot: "phone-week-full", fx: 0.5, fy: 0.38, z: 1.18, z2: 1.32, cap: "The week fills in" },
    { a: 10.7, b: 13.35, shot: "phone-shop", fx: 0.5, fy: 0.55, z: 1.16, z2: 1.24, cap: "Shop by aisle" },
    { a: 13.35, b: 16.15, shot: "phone-shop-have", fx: 0.45, fy: 0.48, z: 1.22, z2: 1.3, cap: "Shop by aisle",
      tap: { t: 13.7, x: 0.862, y: 0.5 } },
    { a: 16.15, b: 21.15, shot: "tablet-print", fx: 0.5, fy: 0.16, z: 1.02, z2: 1.08, cap: "Print it. Works offline.", device: "tablet" }
  ];

  var shotImg = document.getElementById("shotImg");
  var shot = document.getElementById("shot");
  var finger = document.getElementById("finger");
  var phone = document.getElementById("phone");
  var screen = document.getElementById("screen");

  function showShot(beat, t) {
    var p = clamp((t - beat.a) / (beat.b - beat.a));
    var eased = p * p * (3 - 2 * p);
    var zoom = lerp(beat.z, beat.z2, eased);
    var tablet = beat.device === "tablet";
    phone.className = "device " + (tablet ? "tablet" : "phone");
    var aspect = tablet ? (1100 / 1400) : (390 / 844);
    var sw = screen.clientWidth;
    var sh = screen.clientHeight;
    var shotW = sw * zoom;
    var shotH = shotW / aspect;
    var fy = beat.fy + (tablet ? 0.06 : 0.05) * eased;
    var left = sw * 0.5 - beat.fx * shotW;
    var top = sh * (tablet ? 0.42 : 0.48) - fy * shotH;
    left = Math.min(0, Math.max(sw - shotW, left));
    top = Math.min(0, Math.max(sh - shotH, top));
    var src = "../footage/" + beat.shot + ".png";
    if (shotImg.getAttribute("src") !== src) shotImg.src = src;
    shot.style.width = shotW + "px";
    shot.style.height = shotH + "px";
    shot.style.transform = "translate(" + left + "px," + top + "px)";
    var tap = beat.tap;
    if (tap && t >= tap.t && t < tap.t + 0.42) {
      var u = clamp((t - tap.t) / 0.42);
      var scale = u < 0.35 ? lerp(1.35, 0.82, u / 0.35) : lerp(0.82, 1.05, (u - 0.35) / 0.65);
      finger.style.opacity = String(u < 0.8 ? 1 : 1 - (u - 0.8) / 0.2);
      finger.style.left = (tap.x * 100) + "%";
      finger.style.top = (tap.y * 100) + "%";
      finger.style.transform = "translate(-50%,-50%) scale(" + scale + ")";
    } else {
      finger.style.opacity = "0";
    }
  }

  window.renderAt = function (t) {
    document.getElementById("hook").style.opacity = fade(t, 0, 1.72, false, true);
    document.getElementById("cta").style.opacity = fade(t, 21.0, 26.0, true, false);
    var rig = 0;
    var cap = "";
    var active = null;
    beats.forEach(function (beat) {
      var o = fade(t, beat.a, beat.b, true, true);
      if (o > rig) { rig = o; active = beat; cap = beat.cap; }
    });
    document.getElementById("rig").style.opacity = rig;
    var capEl = document.getElementById("cap");
    capEl.style.opacity = rig > 0.4 && t < 20.9 ? String(Math.min(1, rig)) : "0";
    document.getElementById("capText").textContent = cap || "Pick the meals";
    if (active && rig > 0) showShot(active, t);
  };

  window.renderAt(0);
})();
</script>
</body>
</html>
