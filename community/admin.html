<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moderation — Developer Marketplace — Digital Underground</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05040c">
<link rel="stylesheet" href="community.css">
</head>
<body>
<div class="wrap">
  <div class="site-top">
    <a class="brand" href="/store/">
      <img src="/store/logo.png" width="80" height="65" alt="">
      <strong>Digital Underground</strong>
    </a>
    <nav aria-label="Site">
      <a href="/community/">Developer Marketplace</a>
    </nav>
  </div>
  <header class="page-head">
    <h1>Moderation</h1>
    <p>Protected queue. Paste the admin token below (stored only in this browser session).</p>
  </header>
  <form class="stack" id="token-form" onsubmit="return false;">
    <label>Admin token
      <input type="password" id="token" autocomplete="off">
    </label>
    <p class="admin-actions">
      <button type="button" id="load" class="admin-load">Load pending</button>
      <button type="button" id="download-contacts" class="admin-load secondary">Download contacts CSV</button>
    </p>
  </form>
  <div class="admin-list" id="list" aria-live="polite"></div>
  <footer class="foot"><p><a href="/community/">← Developer Marketplace</a></p></footer>
</div>
<script>
(function () {
  var KEY = "du-community-admin-token";
  var tokenInput = document.getElementById("token");
  var list = document.getElementById("list");
  try {
    var saved = sessionStorage.getItem(KEY);
    if (saved) tokenInput.value = saved;
  } catch (e) {}

  function headers() {
    var t = tokenInput.value.trim();
    try { sessionStorage.setItem(KEY, t); } catch (e) {}
    return {
      Authorization: "Bearer " + t,
      "Content-Type": "application/json"
    };
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  }

  function renderPending(rows) {
    list.innerHTML = "";
    if (!rows.length) {
      list.innerHTML = "<p class=\"empty\">No pending submissions.</p>";
      return;
    }
    rows.forEach(function (row) {
      var el = document.createElement("div");
      el.className = "admin-item";
      el.innerHTML =
        "<strong>" + esc(row.name) + "</strong> · " + esc(row.makerName) +
        "<br><a href=\"" + esc(row.projectUrl) + "\" target=\"_blank\" rel=\"noopener\">" + esc(row.projectUrl) + "</a>" +
        "<br><span class=\"blurb\">" + esc(row.pitchShort) + "</span>" +
        "<br><small>" + esc(row.id) + " · " + esc(row.email) + "</small>" +
        '<div class="actions">' +
        '<button type="button" class="approve" data-id="' + esc(row.id) + '" data-action="approve">Approve</button>' +
        '<button type="button" class="reject" data-id="' + esc(row.id) + '" data-action="reject">Reject</button>' +
        '<button type="button" data-id="' + esc(row.id) + '" data-action="delete">Delete</button>' +
        "</div>";
      list.appendChild(el);
    });
  }

  function act(action, id) {
    return fetch("/api/community/admin", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ action: action, id: id })
    }).then(function (r) { return r.json().then(function (d) { return { r: r, d: d }; }); });
  }

  list.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-action]");
    if (!btn) return;
    act(btn.getAttribute("data-action"), btn.getAttribute("data-id")).then(function (out) {
      if (!out.r.ok) {
        alert(out.d.error || "Failed");
        return;
      }
      document.getElementById("load").click();
    });
  });

  document.getElementById("load").addEventListener("click", function () {
    fetch("/api/community/admin", { headers: headers() })
      .then(function (r) { return r.json().then(function (d) { return { r: r, d: d }; }); })
      .then(function (out) {
        if (!out.r.ok) {
          alert(out.d.error || "Unauthorized");
          return;
        }
        renderPending(out.d.pending || []);
      });
  });

  document.getElementById("download-contacts").addEventListener("click", function () {
    var t = tokenInput.value.trim();
    if (!t) {
      alert("Paste the admin token first.");
      return;
    }
    fetch("/api/community/admin?action=contacts", {
      headers: { Authorization: "Bearer " + t }
    }).then(function (r) {
      if (!r.ok) {
        return r.json().then(function (d) {
          throw new Error(d.error || "Download failed");
        });
      }
      return r.blob().then(function (blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "developer-marketplace-contacts.csv";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      });
    }).catch(function (err) {
      alert(err.message || "Download failed");
    });
  });
})();
</script>
</body>
</html>
