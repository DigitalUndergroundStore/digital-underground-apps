<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DU Command — Owner</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05080f">
<link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg">
<style>
  :root {
    --bg: #05080f;
    --panel: rgba(8, 18, 36, 0.72);
    --line: rgba(80, 180, 255, 0.28);
    --text: #d7ecff;
    --muted: #7aa0c2;
    --accent: #3db8ff;
    --accent2: #7c5cff;
    --ok: #3dffb0;
    --warn: #ffc857;
    --danger: #ff6b7a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body {
    min-height: 100dvh;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, rgba(70, 40, 180, 0.28), transparent 55%),
      radial-gradient(ellipse 50% 40% at 50% 48%, rgba(40, 140, 255, 0.18), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(6, 14, 32, 0.95), #02040a 78%),
      repeating-linear-gradient(60deg, transparent 0 22px, rgba(90,160,255,0.045) 22px 23px),
      repeating-linear-gradient(-60deg, transparent 0 22px, rgba(120,80,255,0.04) 22px 23px);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(circle at 50% 45%, transparent 18%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.75) 100%);
  }
  .shell { position: relative; z-index: 1; min-height: 100dvh; }
  body.focus .side { opacity: 0.28; filter: saturate(0.6); pointer-events: none; }
  body.focus #btn-focus { background: rgba(61,184,255,0.25); border-color: var(--accent); color: #fff; }
  .topbar {
    position: absolute; inset: 12px 16px auto; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .brand span { color: var(--muted); font-weight: 500; margin-left: 8px; letter-spacing: 0.08em; }
  .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: rgba(0,0,0,0.35); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .chip.on { border-color: var(--accent); color: #fff; background: rgba(61,184,255,0.18); }
  a.chip { text-decoration: none; }
  .stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 72px 16px 120px;
  }
  .orb-wrap { position: relative; width: min(280px, 55vw); aspect-ratio: 1; display: grid; place-items: center; }
  .orb {
    width: 58%; height: 58%; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #c5e7ff, #4b7cff 40%, #5b2dff 70%, #0a1030 100%);
    box-shadow: 0 0 50px rgba(90,120,255,0.65), 0 0 140px rgba(90,40,255,0.35), inset 0 0 40px rgba(255,255,255,0.28);
    animation: pulse 3.2s ease-in-out infinite;
  }
  .orb img { width: 42%; height: auto; filter: drop-shadow(0 0 12px rgba(255,255,255,0.45)); opacity: 0.95; }
  .ring {
    position: absolute; inset: 8%; border-radius: 50%;
    border: 1px solid rgba(100,190,255,0.35);
    animation: spin 18s linear infinite;
  }
  .ring:nth-child(2) { inset: 0; border-style: dashed; opacity: 0.55; animation-duration: 28s; animation-direction: reverse; }
  .ring:nth-child(3) { inset: 18%; border-color: rgba(124,92,255,0.35); animation-duration: 12s; }
  body.focus .orb { animation-duration: 5s; }
  @keyframes pulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.04);} }
  @keyframes spin { to { transform: rotate(360deg);} }
  .subtitle {
    position: absolute; top: calc(50% + min(150px, 28vw)); left: 50%; transform: translateX(-50%);
    width: min(520px, 92vw); text-align: center; color: var(--text); font-size: 15px; line-height: 1.45;
    text-shadow: 0 0 20px rgba(0,0,0,0.8);
    min-height: 2.9em;
  }
  .side {
    position: absolute; top: 56px; bottom: 108px; width: min(340px, 32vw);
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    backdrop-filter: blur(10px); overflow: hidden; display: flex; flex-direction: column;
    transition: opacity .35s ease, filter .35s ease;
  }
  .side.left { left: 16px; }
  .side.right { right: 16px; }
  .side h2 {
    margin: 0; padding: 14px 16px 10px; font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--line);
  }
  .side .list { overflow: auto; padding: 8px; flex: 1; }
  .item {
    display: grid; grid-template-columns: 10px 1fr; gap: 8px 10px;
    padding: 10px; border-radius: 12px; margin-bottom: 6px;
    background: rgba(255,255,255,0.03); border: 1px solid transparent;
  }
  .item:hover { border-color: var(--line); background: rgba(61,184,255,0.06); }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--ok); box-shadow: 0 0 8px currentColor; }
  .dot.warn { background: var(--warn); color: var(--warn); }
  .dot.idle { background: var(--muted); color: var(--muted); box-shadow: none; }
  .item strong { display: block; font-size: 13px; }
  .item span { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
  .wait .item { grid-template-columns: 1fr; }
  .wait .actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn {
    border: 1px solid var(--line); background: rgba(0,0,0,0.35); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .btn.ok { border-color: rgba(61,255,176,0.45); color: var(--ok); }
  .btn.later { color: var(--muted); }
  .dock {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(720px, 94vw); z-index: 6;
    display: flex; flex-direction: column; gap: 10px; align-items: stretch;
  }
  .ask {
    display: flex; gap: 8px; align-items: center;
    background: rgba(0,0,0,0.55); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 10px 8px 16px;
  }
  .ask input {
    flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 15px;
  }
  .ask input::placeholder { color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .gate {
    position: absolute; inset: 0; z-index: 20; display: grid; place-items: center;
    background: rgba(2,5,10,0.92); text-align: center; padding: 24px;
  }
  .gate.hidden { display: none; }
  .gate a { color: var(--accent); }
  @media (max-width: 900px) {
    body { overflow: auto; }
    .side { position: relative; top: auto; left: auto !important; right: auto !important; bottom: auto; width: auto; margin: 12px 12px 0; max-height: 280px; }
    .stage { position: relative; padding: 80px 12px 24px; min-height: 360px; }
    .subtitle { position: static; transform: none; width: auto; margin-top: 18px; }
    .dock { position: sticky; bottom: 0; left: auto; transform: none; width: auto; padding: 12px; background: linear-gradient(transparent, rgba(2,5,10,0.95) 30%); }
    .shell { display: flex; flex-direction: column; min-height: 100dvh; }
  }
</style>
</head>
<body>
<div id="gate" class="gate">
  <div>
    <p class="brand" style="margin-bottom:12px">DU COMMAND</p>
    <p style="color:var(--muted);max-width:360px;margin:0 auto 16px">Owner session required. Open the owner dashboard and sign in, then come back here.</p>
    <a class="chip" href="/owner/">Open owner dashboard</a>
  </div>
</div>
<div class="shell">
  <div class="topbar">
    <div class="brand">DU COMMAND <span>HUD · private</span></div>
    <div class="top-actions">
      <button type="button" class="chip on" id="btn-voice" aria-pressed="true">Voice: on</button>
      <a class="chip" href="/owner/">← Owner home</a>
    </div>
  </div>

  <aside class="side left" aria-label="Systems">
    <h2 id="sys-title">Systems — …</h2>
    <div class="list" id="sys-list"></div>
  </aside>

  <aside class="side right wait" aria-label="Waiting on you">
    <h2 id="wait-title">Waiting on you — …</h2>
    <div class="list" id="wait-list"></div>
  </aside>

  <div class="stage">
    <div class="orb-wrap" aria-hidden="true">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="orb"><img src="/assets/logo/du-mark.svg" alt="" width="72" height="72"></div>
    </div>
    <p class="subtitle" id="line" role="status">Initializing…</p>
  </div>

  <div class="dock">
    <div class="ask">
      <input id="ask" type="text" placeholder="Ask Jarvis…" autocomplete="off" enterkeyhint="send">
      <button type="button" class="btn" id="btn-ask">Send</button>
    </div>
    <div class="pills">
      <button type="button" class="chip" data-q="Morning brief">Morning brief</button>
      <button type="button" class="chip" data-q="Status">Status</button>
      <button type="button" class="chip" data-q="What's reading">What's reading</button>
      <button type="button" class="chip" id="btn-focus">Focus mode</button>
    </div>
  </div>
</div>
<script>
(function () {
  var SYSTEMS = [
    { name: "Gerold", status: "ok", detail: "CEO desk · site deploys, Buffer, X drafts" },
    { name: "Jarvis", status: "ok", detail: "Morning plate weekdays 8am ET · triage hub" },
    { name: "Scout", status: "warn", detail: "Digs paused until Writer needs stock" },
    { name: "Writer", status: "ok", detail: "Outreach READY sends · Writer-gated digs" },
    { name: "Store", status: "ok", detail: "Gumroad USD kits · Coming soon queue Nov 2" },
    { name: "Content", status: "ok", detail: "USD marketing copy + League pitch rebrand" },
    { name: "Buffer", status: "ok", detail: "Grow every 30m · refill hourly · queue full" },
    { name: "League", status: "ok", detail: "Week 2 live · best product, most votes" },
    { name: "QC", status: "idle", detail: "No open product reviews" },
    { name: "Director", status: "idle", detail: "No active video brief" }
  ];
  var WAITING = [
    { id: "w1", who: "You", text: "Pin Week 2 Maker League post (or keep grow pin)" },
    { id: "w2", who: "Build", text: "Maker inbox v1 — authorized, not started" },
    { id: "w3", who: "Stripe", text: "Stripe setup still paused — resume when ready" },
    { id: "w4", who: "GitHub", text: "GSAHavok suspension — ticket #4889640 awaiting reply" }
  ];
  var later = JSON.parse(localStorage.getItem("du_cmd_later") || "[]");
  var done = JSON.parse(localStorage.getItem("du_cmd_done") || "[]");

  function $(id) { return document.getElementById(id); }
  function say(t) { $("line").textContent = t; }

  function renderSys(extra) {
    var list = SYSTEMS.slice();
    if (extra) list = extra.concat(list);
    $("sys-title").textContent = "Systems — " + list.length + " active";
    $("sys-list").innerHTML = list.map(function (s) {
      var cls = s.status === "warn" ? "warn" : s.status === "idle" ? "idle" : "";
      return '<div class="item"><i class="dot ' + cls + '"></i><div><strong>' + s.name + '</strong><span>' + s.detail + '</span></div></div>';
    }).join("");
  }

  function renderWait() {
    var items = WAITING.filter(function (w) { return later.indexOf(w.id) < 0 && done.indexOf(w.id) < 0; });
    $("wait-title").textContent = "Waiting on you — " + items.length;
    $("wait-list").innerHTML = items.map(function (w) {
      return '<div class="item" data-id="' + w.id + '"><div><strong>' + w.who + '</strong><span>' + w.text + '</span><div class="actions">' +
        '<button type="button" class="btn ok" data-act="ok">Approve</button>' +
        '<button type="button" class="btn later" data-act="later">Later</button></div></div></div>';
    }).join("") || '<div class="item"><div><strong>Clear</strong><span>Nothing waiting right now.</span></div></div>';
  }

  $("wait-list").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var id = b.closest("[data-id]").getAttribute("data-id");
    if (b.getAttribute("data-act") === "later") { later.push(id); localStorage.setItem("du_cmd_later", JSON.stringify(later)); say("Parked for later."); }
    else { done.push(id); localStorage.setItem("du_cmd_done", JSON.stringify(done)); say("Marked handled. (Local only — tell Gerold in chat for real work.)"); }
    renderWait();
  });

  $("btn-focus").addEventListener("click", function () {
    document.body.classList.toggle("focus");
    var on = document.body.classList.contains("focus");
    say(on ? "Focus mode on. Panels dimmed — I'll keep the noise down." : "Focus mode off. Panels back.");
  });
  $("btn-voice").addEventListener("click", function () {
    var on = this.getAttribute("aria-pressed") !== "true";
    this.setAttribute("aria-pressed", String(on));
    this.classList.toggle("on", on);
    this.textContent = "Voice: " + (on ? "on" : "off");
  });

  function handleAsk(q) {
    q = (q || "").trim(); if (!q) return;
    var low = q.toLowerCase();
    if (low.indexOf("morning") >= 0 || low.indexOf("brief") >= 0) {
      say("Morning plate lives in Jarvis chat weekdays ~8am ET. League Week 2 is live; Buffer grow queue is full; Maker inbox still pending.");
    } else if (low.indexOf("status") >= 0) {
      say("Systems online. " + SYSTEMS.filter(function(s){return s.status==="ok"}).length + " green, " + SYSTEMS.filter(function(s){return s.status==="warn"}).length + " watch.");
    } else if (low.indexOf("reading") >= 0 || low.indexOf("read") >= 0) {
      say("Reading: owner overview, League Week 2, Buffer refill log. No live feed wired into Command yet.");
    } else if (low.indexOf("focus") >= 0) {
      document.body.classList.add("focus"); say("Focus mode on. Panels dimmed.");
    } else {
      say("Heard. Full talk goes through Jarvis · Chief of Staff in the Grok Bot app until the HUD mic is wired to CoS.");
    }
  }
  $("btn-ask").addEventListener("click", function () { handleAsk($("ask").value); $("ask").value = ""; });
  $("ask").addEventListener("keydown", function (e) { if (e.key === "Enter") { handleAsk(this.value); this.value = ""; } });
  document.querySelectorAll(".pills [data-q]").forEach(function (b) {
    b.addEventListener("click", function () { handleAsk(b.getAttribute("data-q")); });
  });

  renderSys();
  renderWait();

  fetch("/api/owner/overview", { credentials: "same-origin" }).then(function (r) {
    if (!r.ok) throw new Error("auth");
    return r.json();
  }).then(function (d) {
    $("gate").classList.add("hidden");
    say("Systems online. Jarvis is on the bridge next — talk in Grok Bot until the HUD mic is live.");
    var live = (d.listingsLive || 0) + " live · " + (d.pendingCount || 0) + " in review · " + (d.supportOpen || 0) + " support open";
    renderSys([{ name: "Marketplace", status: (d.pendingCount ? "warn" : "ok"), detail: live }]);
  }).catch(function () {
    $("gate").classList.remove("hidden");
    say("Owner session missing.");
  });
})();
</script>
</body>
</html>
