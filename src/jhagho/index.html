<!DOCTYPE html>
<html lang="en" data-du-root="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a2218" />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-title" content="Pantry Week" />
  <meta name="theme-color" content="#f3efe8" />
  <meta name="color-scheme" content="light" />
  <script>(function(){var t="light";try{if(localStorage.getItem("pantry_week_theme")==="dark")t="dark";}catch(e){}document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta name="description" content="Pantry Week is an offline meal planner. Pick recipes, build an aisle shopping list, and cook one step at a time." />
  <title>Pantry Week</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232d9f6f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet" />
  <!--SF_ASSET:css/pantry.css-->
  <!--SF_ASSET:js/icons.js-->
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="pw-scene" aria-hidden="true">
    <div class="pw-backdrop pw-backdrop--photo">
      <img class="pw-backdrop__img" src="images/backdrop-food.webp" width="800" height="900" alt="" decoding="async" fetchpriority="low" />
    </div>
    <div class="pw-backdrop pw-backdrop--wash"></div>
    <div class="pw-backdrop pw-backdrop--bokeh">
      <span class="pw-orb pw-orb--herb"></span>
      <span class="pw-orb pw-orb--tomato"></span>
      <span class="pw-orb pw-orb--yolk"></span>
    </div>
  </div>
  <div id="app">
    <div class="page">
      <header class="masthead">
        <div class="masthead-row">
          <div class="masthead-row__titles">
            <p class="eyebrow">Meal planning · Offline</p>
          </div>
          <button type="button" id="du-install-header" class="install-header-btn" hidden>Install app</button>
          <button type="button" id="pwThemeToggle" class="theme-toggle" data-action="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
          </button>
        </div>
        <div id="du-install" class="install-banner" hidden>
          <div class="install-banner__copy">
            <strong>Install Pantry Week</strong>
            <span>Works offline on your home screen</span>
          </div>
          <button type="button" id="du-install-btn" class="install-banner__btn">Install</button>
        </div>
        <h1>Pantry Week</h1>
        <p class="deck">Plan the week, shop by aisle, cook step by step.</p>
      </header>
      <nav class="tabs" aria-label="Sections" id="tabs"></nav>
      <main id="main" class="main-view"></main>
      <footer class="colophon">Pantry Week · Offline</footer>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="tip" class="modal sheet" hidden role="dialog" aria-modal="true" aria-labelledby="tipTitle">
    <div class="modal-card sheet-card" data-sheet-body="1">
      <div class="sheet-grab" data-sheet-grab="1" aria-hidden="true"></div>
      <div class="modal-head modal-head--chrome">
        <span class="icon-btn icon-btn--spacer" aria-hidden="true"></span>
        <h2 id="tipTitle" class="modal-head__title">Start here</h2>
        <button type="button" class="icon-btn" data-action="nav-back" aria-label="Close">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.42 1.42L10.59 13.4 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.29 10.59 10.6 16.88 4.29z"/></svg>
        </button>
      </div>
      <p id="tipBody"></p>
      <button type="button" class="primary" id="tipOk">Got it</button>
    </div>
  </div>

  <div id="picker" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="pickerTitle"></div>
  <div id="assign" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="assignTitle"></div>
  <div id="editor" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="editorTitle"></div>
  <div id="cook" class="cook" hidden role="dialog" aria-modal="true" aria-labelledby="cookTitle"></div>
  <div id="textDialog" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="textTitle"></div>
  <div id="fill" class="modal sheet" hidden role="dialog" aria-modal="true" aria-labelledby="fillTitle"></div>

  <datalist id="units">
    <option value="cup"></option>
    <option value="tbsp"></option>
    <option value="tsp"></option>
    <option value="oz"></option>
    <option value="lb"></option>
    <option value="g"></option>
    <option value="ml"></option>
    <option value="clove"></option>
    <option value="can"></option>
    <option value="slice"></option>
    <option value="head"></option>
    <option value="bunch"></option>
    <option value="fillet"></option>
    <option value="pinch"></option>
    <option value="stalk"></option>
    <option value="package"></option>
  </datalist>

  <!--SF_ASSET:js/recipes.js-->
  <!--SF_ASSET:js/recipes-extra.js-->
  <!--SF_ASSET:js/recipes-batch1.js-->
  <!--SF_ASSET:js/recipes-batch2.js-->
  <!--SF_ASSET:js/recipes-batch3.js-->
  <!--SF_ASSET:js/recipes-batch4.js-->
  <!--SF_ASSET:js/v1-originals.js-->
  <!--SF_ASSET:js/pantry-normalize.js-->
  <!--SF_ASSET:js/pantry-match.js-->
  <!--SF_ASSET:js/pantry.js-->
  <!--SF_ASSET:js/import-external.js-->
  <!--SF_ASSET:js/smart-chef.js-->
  <!--SF_ASSET:js/photos.js-->
  <!--SF_ASSET:js/hosted.js-->
  <!--SF_ASSET:js/find-recipes.js-->
  <!--SF_ASSET:js/smart-chef-source.js-->
  <!--SF_ASSET:js/photo-recipe.js-->
  <!--SF_ASSET:js/app.js-->
  <script>
    (function () {
      var b = document.getElementById("du-preview");
      if (b && b.parentNode) b.parentNode.removeChild(b);
    })();
  </script>
  <noscript>
    <p class="deck" style="padding:16px">Pantry Week needs JavaScript in this browser. It still runs offline, with no account.</p>
  </noscript>
</body>
</html>
