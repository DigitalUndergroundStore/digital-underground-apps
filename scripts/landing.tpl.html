<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title><meta name="description" content="{{DESC}}"><link rel="canonical" href="{{URL}}">
<meta property="og:title" content="{{TITLE}}"><meta property="og:description" content="{{DESC}}"><meta property="og:type" content="website"><meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{OG}}"><meta property="og:image:alt" content="{{OGALT}}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="{{OG}}">
<meta name="theme-color" content="#05040c"><link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg"><link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/favicon-180.png">
<script type="application/ld+json">{{FAQJSON}}</script>
<style>body{margin:0;background:#05040c;color:#e8e6f0;font:17px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:760px;margin:0 auto;padding:24px 20px 40px}a{color:#c4b5fd}
.top a{font-weight:700;text-decoration:none;color:#fff}h1{font-size:clamp(28px,6vw,40px);line-height:1.15;margin:28px 0 12px;color:#fff}.lead{font-size:19px;color:#d6d2e6}
.hero{width:100%;height:auto;border-radius:14px;margin:18px 0;border:1px solid #2a2440}ul.pts{padding-left:20px}ul.pts li{margin:6px 0}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.cta,.cta2{display:inline-block;padding:13px 20px;border-radius:10px;text-decoration:none;font-weight:700}.cta{background:#7c5cff;color:#fff}.cta2{border:1px solid #6b5bd6;color:#d9d0ff}
h2{margin-top:34px;color:#fff}details{border:1px solid #2a2440;border-radius:10px;padding:10px 14px;margin:8px 0;background:#0e0c18}summary{cursor:pointer;font-weight:600}footer{margin-top:40px;font-size:14px;color:#9a95b3}</style></head>
<body><main>
<p class="top"><a href="/store/">Digital Underground</a></p>
<h1>{{H1}}</h1><p class="lead">{{LEAD}}</p>
<img class="hero" src="{{OG}}" alt="{{OGALT}}" width="1200" height="630" loading="eager">
<ul class="pts">{{POINTS}}</ul>
<div class="ctas">{{CTA}}</div>
<h2>Frequently asked questions</h2>{{FAQ}}
<h2>More from Digital Underground</h2><ul>{{OTHERS}}<li><a href="/store/">All products</a></li></ul>
<footer><a href="/privacy/">Privacy and email policy</a> · <a href="/support/">Support</a></footer>
</main><script src="/assets/signup.js" defer></script></body></html>
