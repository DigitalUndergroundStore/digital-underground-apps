<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry Week UI demo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:DM Sans,system-ui,sans-serif}
.demo-dark{background:#1a1a1a;color:#f2efe8;padding:16px 16px 88px;min-height:100vh}
.demo-bright{background:#f6f3ee;color:#1c1917;padding:16px 16px 88px;min-height:100vh}
h1{font-family:Fraunces,serif;font-size:1.6rem;margin:0 0 12px}
.card{background:#2a2824;border-radius:12px;padding:14px;margin:12px 0}
.demo-bright .card{background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.08);border-radius:18px}
.hero{height:140px;border-radius:12px 12px 0 0;margin:-14px -14px 12px;background:center/cover}
.demo-bright .hero{border-radius:18px 18px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:10px 8px;background:#111;border-top:1px solid #333}
.demo-bright nav{background:rgba(255,255,255,.95);border-top:1px solid #e7e2db}
nav span{font-size:11px}
.tag{display:inline-block;background:#3d6b52;color:#e8f6ef;padding:4px 10px;border-radius:999px;font-size:12px}
.demo-bright .tag{background:#e8f6ef;color:#1f6b4a}
.btn{display:inline-block;padding:10px 16px;border-radius:999px;background:#4a8b67;color:#fff;font-weight:600;font-size:14px}
</style>
</head>
<body>
<section class="demo-dark" id="before">
  <h1>The week</h1>
  <div class="card">
    <div class="hero" style="background-image:url(https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=800&q=80&auto=format&fit=crop)"></div>
    <strong style="font-family:Fraunces,serif;font-size:1.2rem">Lemon Herb Chicken</strong>
    <p style="opacity:.75;margin:6px 0">25 min • 4 servings <span class="tag">Gluten-free</span></p>
    <span class="btn">Cook tonight</span>
  </div>
  <p style="letter-spacing:.12em;font-size:11px;opacity:.7">MONDAY · DINNER</p>
  <nav><span>Plan</span><span>Recipes</span><span>List (86)</span><span>Pantry</span><span>More</span></nav>
</section>
<section class="demo-bright pw-skin-v3" id="after" style="display:none">
  <link rel="stylesheet" href="v3.css">
  <h1>The week</h1>
  <article class="card pw-food-card">
    <div class="pw-food-hero" style="background-image:url(https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=800&q=80&auto=format&fit=crop)"></div>
    <strong style="font-family:Fraunces,serif;font-size:1.25rem">Lemon Herb Chicken</strong>
    <p style="color:#6b6560;margin:6px 0">25 min • 4 servings <span class="tag">Gluten-free</span></p>
    <span class="btn">Cook tonight</span>
  </article>
  <p style="letter-spacing:.12em;font-size:11px;color:#6b6560">MONDAY · DINNER</p>
  <nav><span>Plan</span><span>Recipes</span><span>List (86)</span><span>Pantry</span><span>More</span></nav>
</section>
<script>
const q=new URLSearchParams(location.search);
if(q.get('skin')==='v3'){document.getElementById('before').style.display='none';document.getElementById('after').style.display='block';document.documentElement.classList.add('pw-skin-v3');}
</script>
</body>
</html>
