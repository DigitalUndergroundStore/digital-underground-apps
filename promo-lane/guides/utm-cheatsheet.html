<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c1018" />
<meta name="robots" content="noindex" />
<title>UTM cheatsheet — Promo Lane</title>
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Promo Lane" />
<style>html,body{margin:0;background:#0c1018;color:#eef2f7;font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#du-gate{max-width:440px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 40px}
.du-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(145deg,#2ef2a0,#0c1018);border:1px solid #2ef2a0;margin-bottom:14px}
h1{font-size:1.5rem;margin:0 0 4px}p{color:#a9b4c2;margin:0 0 14px}
#du-form{display:none}#du-form.on{display:block}
label{display:block;font-size:.9rem;color:#a9b4c2;margin:0 0 6px}
input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;letter-spacing:.06em;padding:13px 14px;border-radius:12px;border:1px solid #3a4352;background:rgba(255,255,255,.05);color:#eef2f7;text-transform:uppercase}
input:focus{outline:2px solid #2ef2a0;outline-offset:1px}
button{width:100%;min-height:50px;margin-top:12px;font:inherit;font-weight:700;color:#0b0f14;border:0;border-radius:999px;background:#2ef2a0;cursor:pointer}
button:disabled{opacity:.6}
#du-msg{min-height:1.5em;margin-top:12px;color:#2ef2a0}#du-msg.bad{color:#f0a0a0}
.du-help{font-size:.9rem;border-top:1px solid #3a4352;margin-top:22px;padding-top:14px}
.du-help a{color:#2ef2a0;display:inline-block;padding:8px 2px}</style>
</head>
<body>
<main id="du-gate">
  <div class="du-logo" aria-hidden="true"></div>
  <h1>Promo Lane</h1>
  <p id="du-status">Opening…</p>
  <form id="du-form" autocomplete="off">
    <label for="du-code">Buyer code</label>
    <input id="du-code" name="code" placeholder="PR-XXXX-XXXX-XXXX" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text" />
    <button id="du-go" type="submit">Unlock</button>
    <div id="du-msg" role="status" aria-live="polite"></div>
    <div class="du-help">
      <p>Your buyer code is in <strong>ON YOUR PHONE - START HERE.pdf</strong>, which came with your Promo Lane download on Gumroad or Payhip. Tapping the link in that PDF unlocks it automatically. You only need to do this once on each device.</p>
      <p>Don't have Promo Lane yet? <a href="https://kerzy.gumroad.com/l/mlrnfq">Gumroad</a> · <a href="https://payhip.com/b/Ddtq3">Payhip</a></p>
    </div>
  </form>
  <noscript><p>Promo Lane needs JavaScript turned on.</p></noscript>
</main>
<script src="../unlock.js?v=202610072058-b87ede20" data-page="guides/utm-cheatsheet.html" data-root="../"></script>
</body>
</html>
